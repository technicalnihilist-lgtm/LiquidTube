/* ---------------- search ---------------- */
let searchSeq=0;
async function find(go){
  const r=$('#res');if(!r)return;
  const id=parse(q);
  let h='';
  if(id){if(!V[id])vObj(id,{t:'YouTube video',c:'YouTube',cat:'Link'});h+='<h2>Play link</h2>'+rowv(V[id])}
  const loc=Object.values(V).filter(ok).filter(v=>q&&(v.t+' '+v.c+' '+v.cat).toLowerCase().includes(q.toLowerCase()));
  if(!q){
    h+=(S.rs.length?'<h2>Recent</h2><div class="chips">'+S.rs.map(s=>'<button class="chip glass" data-q="'+esc(s)+'">🕘 '+esc(s)+'</button>').join('')+'</div>':'');
    if(S.opt.sg)h+='<h2>Suggested</h2>'+feed().slice(0,5).map(rowv).join('');
  }else if(loc.length)h+='<h2>In app</h2>'+loc.map(rowv).join('');
  r.innerHTML=h+'<div id="api"></div>';
  if(!q||id||!go)return;
  const box=$('#api');box.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const seq=++searchSeq;
  try{
    const j=await yt('search',{part:'snippet',type:'video',maxResults:20,q:q});
    if(seq!==searchSeq)return;
    const list=(j.items||[]).filter(it=>it.id&&it.id.videoId).map(it=>vObj(it.id.videoId,{t:it.snippet.title,c:it.snippet.channelTitle,ch:it.snippet.channelId,img:bestTh(it.snippet.thumbnails),pub:it.snippet.publishedAt,cat:'Result'}));
    /* channels come out of the video results — a second search only runs when the results are thin,
       because YouTube meters search.list separately (100 calls/day) */
    let chIds=[...new Set(list.map(v=>v.ch).filter(Boolean))].slice(0,6);
    if(list.length<4){
      try{
        const cj=await yt('search',{part:'snippet',type:'channel',maxResults:6,q:q});
        chIds=[...new Set(chIds.concat((cj.items||[]).map(it=>(it.id&&it.id.channelId)||it.snippet.channelId).filter(Boolean)))];
      }catch(e){}
    }
    await Promise.all([loadChannels(list.map(v=>v.ch)),loadChannels(chIds)]);
    try{const st=await yt('videos',{part:'statistics',id:list.slice(0,20).map(v=>v.id).join(',')});
      (st.items||[]).forEach(it=>{if(V[it.id]&&it.statistics)V[it.id].views=it.statistics.viewCount})}catch(e){}
    if(seq!==searchSeq)return;
    let out='';
    const chans=chIds.map(id=>CH[id]).filter(Boolean);
    if(chans.length)out+='<h2>Channels</h2>'+chans.map(chRow).join('');
    out+='<h2>Videos</h2>'+list.filter(ok).map(rowv).join('');
    if(list.some(v=>!ok(v)))out+='<div class="hint">Some results are hidden by your filters.</div>';
    box.innerHTML=out;
  }catch(e){
    if(seq!==searchSeq)return;
    window.LASTSTACK=(e&&e.stack)||String(e);
    const msg=String((e&&e.message)||'');
    box.innerHTML=/quota/i.test(msg)
      ? '<div class="empty">YouTube\'s daily search limit is used up for this key.<br>Search works again after midnight PT — the feed, channels and playback keep working.</div>'
      : '<div class="empty">Search failed. '+esc(msg||'Check your connection.')+'</div>';
  }
}

  const rows=[

async function channelPage(first){
  if(chanBusy)return;chanBusy=true;
  const c=CH[chanId];const listEl=$('#chlist');
  if(first){listEl.innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';$('#chmore')&&$('#chmore').remove()}
  if(!c.up){listEl.innerHTML='<div class="empty">This channel does not expose its uploads.</div>';chanBusy=false;return}
  try{
    const j=await yt('playlistItems',{part:'snippet,contentDetails',playlistId:c.up,maxResults:50,pageToken:chanTok||''});
    const items=(j.items||[]).map(it=>vObj(it.snippet.resourceId.videoId,{t:it.snippet.title,c:c.title,ch:chanId,img:bestTh(it.snippet.thumbnails),pub:it.contentDetails&&it.contentDetails.videoPublishedAt,cat:'Channel'}));
    chanTok=j.nextPageToken||'';
    if(first)listEl.innerHTML='';

    const old=$('#chmore');if(old)old.remove();
    if(chanTok){$('#chp').insertAdjacentHTML('beforeend','<button class="loadmore" id="chmore">Load more videos</button>');
      $('#chmore').onclick=()=>{$('#chmore').remove();channelPage(false)}}
    else if(!listEl.innerHTML.trim())listEl.innerHTML='<div class="empty">This channel has no public videos.</div>';
  }catch(e){listEl.innerHTML='<div class="empty">Could not load videos. '+esc(e.message||'')+'</div>'}
  chanBusy=false;
}

  if(!on){el.innerHTML='';return}
  const list=feed().slice(0,12);
  el.innerHTML=list.map(v=>'<section class="sx" data-id="'+v.id+'" style="background:linear-gradient(160deg,'+v.g[0]+','+v.g[1]+')"><div class="sf"><span>'+v.e+'</span></div><div class="sa"><button class="rb glass" data-sl="'+v.id+'" aria-label="Like">'+(S.liked.includes(v.id)?'♥':'♡')+'</button><button class="rb glass" data-sw="'+v.id+'" aria-label="Watch later">🕐</button><button class="rb glass" data-ss="'+v.id+'" aria-label="Share">↗</button></div><div class="sd glass"><b>'+esc(v.t)+'</b><span>'+esc(v.c)+' · swipe up</span></div></section>').join('');
  const io=new IntersectionObserver(es=>es.forEach(x=>{const id=x.target.dataset.id,f=x.target.querySelector('.sf');
    if(x.isIntersecting&&x.intersectionRatio>.6){f.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0&loop=1&playlist='+id+'" allow="autoplay; encrypted-media; fullscreen" title="'+esc(V[id].t)+'"></iframe>'}
    else if(f.querySelector('iframe'))f.innerHTML='<span>'+V[id].e+'</span>'}),{root:el,threshold:[.6]});
  el.querySelectorAll('.sx').forEach(s=>io.observe(s));
}

/* ---------------- menus ---------------- */
function catForm(){const m=$('#md');m.innerHTML='<div class="mc glass"><b style="font-size:18px">New category or topic</b><input id="cn" placeholder="Name, e.g. Study music" maxlength="24"><input id="ck2" placeholder="Auto-add keywords (optional), comma separated"><div class="hint" style="margin:0">Videos whose title or channel match a keyword are added automatically. You can also add videos by hand from the player.</div><div style="display:flex;gap:8px"><button class="act glass" id="mx" style="flex:1">Cancel</button><button class="act" id="mo" style="flex:1;background:var(--red);color:#fff">Create</button></div></div>';m.classList.add('on');
  $('#mx').onclick=()=>m.classList.remove('on');
  $('#mo').onclick=()=>{const n=$('#cn').value.trim();if(!n||S.cats[n]||n==='All'){toast(n?'Name already used':'Enter a name');return}S.cats[n]={kw:$('#ck2').value.trim(),ids:[]};save();cat=n;m.classList.remove('on');render()}}
function catMenu(){const b=$('#pls'),id=cur.id,n=Object.keys(S.cats);
  b.innerHTML='<div class="set glass" style="margin:0 0 12px"><b>Add to category</b><div style="margin-top:8px">'+(n.map(k=>'<button class="act glass '+(S.cats[k].ids.includes(id)?'on':'')+'" data-cm="'+esc(k)+'" style="margin:0 6px 8px 0">'+(S.cats[k].ids.includes(id)?'✓ ':'')+esc(k)+'</button>').join('')||'<div class="hint">No categories yet.</div>')+'</div><div class="sbar" style="height:40px;padding:0"><input id="cn2" placeholder="New category name" maxlength="24"><button class="act" id="ca" style="background:none">Create</button></div></div>';
  $('#ca').onclick=()=>{const t=$('#cn2').value.trim();if(t&&!S.cats[t]&&t!=='All'){S.cats[t]={kw:'',ids:[id]};save();toast('Created '+t);catMenu()}};
  b.querySelectorAll('[data-cm]').forEach(x=>x.onclick=()=>{toggle(S.cats[x.dataset.cm].ids,id);catMenu()})}
function plMenu(){const b=$('#pls'),id=cur.id,n=Object.keys(S.pl);
  b.innerHTML='<div class="set glass" style="margin:0 0 12px">'+(n.map(k=>'<button class="act glass '+(S.pl[k].includes(id)?'on':'')+'" data-pl="'+esc(k)+'" style="margin:0 6px 8px 0">'+(S.pl[k].includes(id)?'✓ ':'')+esc(k)+'</button>').join('')||'')+'<div class="sbar" style="height:40px;padding:0"><input id="pn" placeholder="New playlist name" maxlength="30"><button class="act" id="pa" style="background:none">Create</button></div></div>';
  $('#pa').onclick=()=>{const t=$('#pn').value.trim();if(t){S.pl[t]=S.pl[t]||[];if(!S.pl[t].includes(id))S.pl[t].push(id);save();toast('Saved to '+t);plMenu()}};
  b.querySelectorAll('[data-pl]').forEach(x=>x.onclick=()=>{toggle(S.pl[x.dataset.pl],id);plMenu()})}
function blockMenu(id){const v=V[id],m=$('#md');m.innerHTML='<div class="mc glass"><b style="font-size:18px">'+esc(v.t)+'</b><button class="act glass" id="k1" style="height:44px">🚫 Block channel “'+esc(v.c)+'”</button><button class="act glass" id="k2" style="height:44px">🚫 Block this video</button><button class="act glass" id="k3" style="height:44px">Cancel</button></div>';m.classList.add('on');
  $('#k1').onclick=()=>{if(!S.blk.ch.includes(v.c))S.blk.ch.push(v.c);save();m.classList.remove('on');render();toast('Blocked '+v.c)};
  $('#k2').onclick=()=>{if(!S.blk.vid.includes(id))S.blk.vid.push(id);save();m.classList.remove('on');render();toast('Video blocked')};
  $('#k3').onclick=()=>m.classList.remove('on')}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;render();$('#main').scrollTop=0;return}
  const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render();return}
  const kk=e.target.closest('[data-k]');if(kk){blockMenu(kk.dataset.k);return}
  const cp=e.target.closest('[data-chplay]');if(cp){const rr=document.querySelector('#chlist .row[data-v]');if(rr)play(rr.dataset.v);else toast('No videos loaded yet');return}
  const co=e.target.closest('[data-chopen]');if(co&&!e.target.closest('button')){openVideoChannel(co.dataset.chopen);return}
  const ch=e.target.closest('[data-ch]');if(ch&&(ch===e.target||!e.target.closest('button'))){openChannel(ch.dataset.ch);return}
  const cs=e.target.closest('[data-chsub]');if(cs){toggle(S.subs,cs.dataset.chsub);toast(S.subs.includes(cs.dataset.chsub)?'Subscribed':'Unsubscribed');const h=$('#chhead');if(h&&CH[cs.dataset.chsub])h.innerHTML=channelHead(CH[cs.dataset.chsub]);return}
  const sb=e.target.closest('[data-sub]');if(sb){toggle(S.subs,sb.dataset.sub);render();return}
  const sq=e.target.closest('[data-shelfq]');if(sq){tab='search';q=sq.dataset.shelfq;render();find(true);return}
  const rq=e.target.closest('[data-q]');if(rq){q=rq.dataset.q;render();find(true);return}
  const sl=e.target.closest('[data-sl]');if(sl){toggle(S.liked,sl.dataset.sl);sl.textContent=S.liked.includes(sl.dataset.sl)?'♥':'♡';return}
  const sw=e.target.closest('[data-sw]');if(sw){toggle(S.later,sw.dataset.sw);toast(S.later.includes(sw.dataset.sw)?'Saved to Watch later':'Removed');return}
  const ss=e.target.closest('[data-ss]');if(ss){const u='https://youtu.be/'+ss.dataset.ss;try{navigator.share?navigator.share({url:u}):navigator.clipboard.writeText(u).then(()=>toast('Link copied'))}catch(x){toast(u)}return}
  const v=e.target.closest('[data-v]');if(v&&!e.target.closest('#pl .frame'))play(v.dataset.v);
});
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};

/* ---------------- refresh ---------------- */
let refreshing=false;
function ptrShow(on,text,spin){
  const p=$('#ptr');if(!p)return;
  p.style.opacity='';p.style.transform='';
  p.classList.toggle('on',!!on);p.classList.toggle('spin',!!spin);
  const t=$('#ptrTxt');if(t)t.textContent=text||'';
}
async function doRefresh(){
  if(refreshing)return;refreshing=true;
  const b=$('#rf');if(b)b.classList.add('spin');
  ptrShow(true,'Refreshing…',true);
  FEED.trending=null;FEED.error='';FEED.loading=false;
  const hadQuery=(tab==='search'&&q.trim());
  try{await loadTrending()}catch(e){}
  render();
  if(hadQuery)await find(true);
  if($('#chp').classList.contains('on')&&chanId){try{await channelPage(true)}catch(e){}}
  refreshing=false;
  if(b)b.classList.remove('spin');
  ptrShow(false);
  toast(FEED.trending?'Refreshed':'Could not refresh');
}

/* ---------------- splash ---------------- */
let feedStarted=false;
function bootFeed(){
  if(feedStarted)return;feedStarted=true;
  loadTrending().then(list=>{if(list&&list.length&&tab==='home')render();if(tab==='search'&&!q)find();if(tab==='subs'||tab==='lib')render()});
}
function endSplash(){
  bootFeed();
  const sp=$('#splash');if(!sp){return}
  sp.classList.add('out');
  setTimeout(()=>{if(sp&&sp.parentNode)sp.parentNode.removeChild(sp)},700);
}
function startSplash(){
  const sp=$('#splash');if(!sp)return;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){setTimeout(endSplash,900);return}
  const title=sp.querySelector('.sp-title');
  let done=false;
  const go=()=>{if(done)return;done=true;setTimeout(endSplash,640)};
  try{
    const a=title&&title.getAnimations&&title.getAnimations()[0];
    if(a&&a.finished)a.finished.then(go).catch(go);
  }catch(e){}
  setTimeout(go,6500);   /* safety net if the animation never reports back */
}

/* ---------------- boot ---------------- */
$('#rf').onclick=doRefresh;
addEventListener('resize',()=>movePill(true));
startSplash();
(function(){
  const m=$('#main'),ptr=$('#ptr'),txt=$('#ptrTxt'),ico=ptr?ptr.querySelector('svg'):null;
  let y0=0,pull=false,dist=0;
  const reset=()=>{ptr.style.opacity='';ptr.style.transform='';ptr.classList.remove('on','spin');if(ico)ico.style.transform=''};
  m.addEventListener('touchstart',e=>{if(m.scrollTop<=0&&!refreshing){y0=e.touches[0].clientY;pull=true;dist=0}},{passive:true});
  m.addEventListener('touchmove',e=>{
    if(!pull)return;
    dist=Math.max(0,e.touches[0].clientY-y0);
    if(dist<6)return;
    const p=Math.min(1,dist/120);
    ptr.classList.remove('on','spin');
    ptr.style.opacity=Math.min(1,p*1.7);
    ptr.style.transform='translate(-50%,'+(-28+34*p)+'px) scale('+(0.9+0.1*p)+')';
    if(ico)ico.style.transform='rotate('+(p*200)+'deg)';
    txt.textContent=dist>=120?'Release to refresh':'Pull to refresh';
  },{passive:true});
  m.addEventListener('touchend',()=>{
    if(!pull)return;pull=false;
    if(dist>=120){reset();doRefresh()}
    else{reset()}
    dist=0;
  },{passive:true});
})();
render();
</script>
