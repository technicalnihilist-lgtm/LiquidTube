<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiquidTube</title>
<style>
:root{--bg:#f3f3f7;--ink:#0b0b0f;--mute:#6c6c78;--g1:rgba(255,255,255,.55);--g2:rgba(255,255,255,.14);--rim:rgba(255,255,255,.95);--shade:rgba(20,20,40,.16);--red:#ff2d3d;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b10;--ink:#f5f5f8;--mute:#9a9aa8;--g1:rgba(90,90,110,.5);--g2:rgba(40,40,55,.2);--rim:rgba(255,255,255,.4);--shade:rgba(0,0,0,.55)}}
:root[data-theme=dark]{--bg:#0b0b10;--ink:#f5f5f8;--mute:#9a9aa8;--g1:rgba(90,90,110,.5);--g2:rgba(40,40,55,.2);--rim:rgba(255,255,255,.4);--shade:rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
@media(min-width:500px){body{background:#cfcfd8}.app{height:min(900px,96%);margin-top:2vh;border-radius:44px;box-shadow:0 30px 80px #0005}}

/* ===== bounce system: real spring curves (linear()) with safe fallbacks ===== */
:root{--bounce:cubic-bezier(.34,1.56,.64,1);--bounce-soft:cubic-bezier(.25,1.25,.4,1)}
@supports (transition-timing-function:linear(0,1)){:root{--bounce:linear(0,0.0425,0.1522,0.3038,0.4746,0.6461,0.8042,0.9394,1.0463,1.1231,1.1711,1.1935,1.1946,1.1797,1.1539,1.1219,1.0879,1.0551,1.0259,1.0017,0.9834,0.9709,0.9638,0.9614,0.9628,0.9668,0.9725,0.9791,0.9857,0.9919,0.9972,1.0014,1.0045,1.0065,1.0074,1.0075,1.007,1.006,1.0048,1.0035,1.0022,1.0011,1.0002,0.9994,1);--bounce-soft:linear(0,0.0207,0.0751,0.1527,0.2448,0.3442,0.4451,0.5432,0.6352,0.7191,0.7935,0.8578,0.912,0.9563,0.9915,1.0183,1.0379,1.0511,1.0591,1.0628,1.0631,1.0608,1.0567,1.0513,1.0452,1.0389,1.0325,1.0265,1.0208,1.0158,1.0113,1.0075,1.0043,1.0018,0.9998,0.9983,0.9972,0.9965,0.9961,0.996,0.9961,0.9962,0.9965,0.9969,1)}}
/* ===== liquid glass ===== */
.glass{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(var(--glassBlur,16px)) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(var(--glassBlur,16px)) saturate(190%) brightness(1.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1.5px 1px var(--rim),inset 0 -1.5px 1px rgba(255,255,255,.22),0 10px 30px var(--shade)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.6),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.3));opacity:.5}
/* pages */
.page{position:absolute;inset:0;z-index:0;overflow-y:auto;overflow-x:hidden;padding-bottom:150px;scrollbar-width:none;background:radial-gradient(70% 22% at 100% 6%,rgba(255,70,110,.22),transparent),radial-gradient(70% 20% at 0% 48%,rgba(70,120,255,.2),transparent),radial-gradient(70% 20% at 100% 85%,rgba(160,80,255,.18),transparent),var(--bg);transition:transform .95s var(--bounce-soft),opacity .45s ease;will-change:transform,opacity}
.page::-webkit-scrollbar{display:none}.drag .page{transition:none}
.top{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;background:linear-gradient(var(--bg) 72%,transparent)}
.row{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px;letter-spacing:-.04em}
.logo i{width:30px;height:21px;border-radius:6px;background:var(--red);position:relative}
.logo i:after{content:"";position:absolute;left:12px;top:5px;border:5.5px solid transparent;border-left:9px solid #fff;border-right:0}
.ic{display:flex;gap:8px}.ic button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:600;transition:background .3s,color .3s,scale .6s var(--bounce)}
.chip.on{background:var(--ink);color:var(--bg);scale:1.06}
h2{font-size:19px;font-weight:800;letter-spacing:-.03em;padding:14px 14px 8px}
#feed,#subfeed,#chlist,#animefeed,#cartoonfeed,#moviesfeed,#results,#ex{perspective:1500px;perspective-origin:50% 40%}
.card{margin:6px 14px 18px;text-align:left;display:block;width:calc(100% - 28px);
  transform-style:preserve-3d;transform:translateZ(0);
  transition:transform .55s var(--bounce),box-shadow .35s ease;
  will-change:transform}
.card.tilt{transition:transform .08s linear,box-shadow .2s ease}
.card .thumb{transform:translateZ(0)}
.card .meta{transform:translateZ(18px)}
.card.tilt .thumb{box-shadow:0 26px 46px -18px rgba(10,12,26,.45)}
html[data-depth=off] .card,html[data-depth=off] .card .meta{transform:none!important;transition:none}
.thumb{aspect-ratio:16/9;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 12px 30px var(--shade)}
.thumb u{position:absolute;right:10px;bottom:10px;padding:2px 7px;border-radius:7px;background:#000a;color:#fff;font-size:11px;text-decoration:none}
.meta{display:flex;gap:10px;padding:10px 4px}
.av{flex:none;width:36px;height:36px;border-radius:50%}
.meta b{font-size:15px;line-height:1.25;display:block}.meta span{font-size:12.5px;color:var(--mute)}
.vh{display:flex;justify-content:space-between;align-items:center;padding:16px 14px 8px}.vh h2{padding:0}
.va{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700}
.car{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.big{flex:none;width:86%;aspect-ratio:4/4.3;border-radius:30px;scroll-snap-align:center;position:relative;overflow:hidden;color:#fff;text-align:left;box-shadow:0 14px 34px var(--shade)}
.big:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000d)}
.big div{position:absolute;left:16px;right:96px;bottom:16px;z-index:2}
.big b{font-size:17px;line-height:1.25;display:block}.big small{font-size:12px;opacity:.75}
.big .play{position:absolute;right:14px;bottom:14px;z-index:3;padding:8px 15px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;display:flex;gap:5px;align-items:center}
.big .play svg{width:13px;height:13px;fill:#fff}
.dots{display:flex;gap:6px;justify-content:center;padding:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);opacity:.4;transition:.25s}.dots i.on{opacity:1;background:var(--ink);transform:scale(1.25)}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--ink) var(--p,0%),rgba(128,128,140,.35) var(--p,0%));outline:0;position:relative;z-index:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0006,inset 0 -2px 3px #0002}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:6px 14px 10px}
.sg button{text-align:center;font-size:11.5px;font-weight:600}.sg i{display:block;width:100%;aspect-ratio:1;border-radius:50%;margin-bottom:6px;box-shadow:0 6px 16px var(--shade);transition:transform .3s,outline-color .3s;outline:3px solid transparent;outline-offset:2px}.sg .on i{outline-color:var(--red);transform:scale(.92)}
/* ===== dock ===== */
.dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;z-index:60;transform-style:flat}
.tabs{flex:1;height:66px;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.tabs .bg{position:absolute;inset:0;border-radius:99px}
.lens{position:absolute;left:5px;top:5px;bottom:5px;width:calc((100% - 10px)/3);border-radius:99px;transition:transform .9s var(--bounce);--g1:rgba(255,255,255,.7);--g2:rgba(255,255,255,.22);pointer-events:none}
.drag .lens{transition:transform .09s linear}
.tabrow{position:absolute;inset:5px;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);transition:color .3s,scale .55s var(--bounce)}
.tab.on{color:var(--red)}.tab svg{width:22px;height:22px}
.sbtn{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;transition:scale .6s var(--bounce)}.sbtn:active{scale:.86}
/* ===== overlays ===== */
#search{position:absolute;inset:0;z-index:30;background:var(--bg);opacity:0;pointer-events:none;transform:translateY(80px) scale(.94);transition:transform .85s var(--bounce),opacity .3s ease;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px;overflow:auto}
#search.on{opacity:1;pointer-events:auto;transform:none}
.sbar{display:flex;gap:10px;align-items:center}.sbar label{flex:1;display:flex;gap:8px;align-items:center;height:46px;border-radius:99px;padding:0 14px}
.sbar input{flex:1;background:none;border:0;outline:0;font:inherit;color:inherit;font-size:16px;min-width:0}
.sbar>button{font-weight:600;color:var(--red)}
.sug{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0}.sug button{padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600}
.res{display:flex;gap:12px;padding:10px 0;text-align:left;width:100%}.res .thumb{width:44%;flex:none;border-radius:16px}.res b{font-size:14px;line-height:1.3}
.empty{padding:40px 10px;text-align:center;color:var(--mute);font-size:14px}
#scrim{position:absolute;inset:0;z-index:38;background:#0006;opacity:0;pointer-events:none;transition:opacity .35s}#scrim.on{opacity:1;pointer-events:auto}
#pl,#sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:40;padding:16px;border-radius:34px;display:flex;flex-direction:column;gap:8px;text-align:left;transform:translateY(125%);transition:transform .9s var(--bounce)}
#pl.on,#sheet.on{transform:none}
#pl b{font-size:16px;line-height:1.3}#pl>span,.tm{font-size:12.5px;color:var(--mute)}.tm{display:flex;justify-content:space-between}
.prow{display:flex;gap:10px;margin-top:4px}.prow button{flex:1;height:46px;border-radius:99px;font-weight:700}
nav.dock{transition:transform .5s var(--bounce),box-shadow .4s ease}
nav.dock:active{transform:scale(.985)}
#sheet{transform-origin:50% 100%;transform:translateY(14px) rotateX(9deg) scale(.97);opacity:0;transition:transform .6s var(--bounce),opacity .35s ease}
#sheet.on{transform:none;opacity:1}
html[data-depth=off] nav.dock,html[data-depth=off] #sheet{transform:none!important}
#sheet{max-height:70%}#sheet h3{font-size:17px;text-align:center;padding-bottom:4px}
#shb{overflow:auto;display:flex;flex-direction:column;gap:12px;max-height:44vh}
.cm{display:flex;gap:10px;font-size:13.5px;line-height:1.35}.cm .av{width:30px;height:30px}.cm small{color:var(--mute);display:block;font-size:11.5px}
.nt{display:flex;gap:10px;align-items:center;font-size:13.5px}.nt .av{width:40px;height:40px}
.opt{height:48px;border-radius:99px;font-weight:700}
#shi{display:none;gap:8px}#shi.on{display:flex}#shi input{flex:1;height:44px;border-radius:99px;padding:0 16px;border:0;outline:0;font:inherit;font-size:15px;color:inherit}
#shi button{padding:0 18px;border-radius:99px;font-weight:700;color:var(--red)}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-90px);z-index:60;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;transition:transform .85s var(--bounce);white-space:nowrap;max-width:90%}
#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){:root{--bounce:cubic-bezier(.25,.9,.3,1);--bounce-soft:cubic-bezier(.25,.9,.3,1)}.skl{animation:none}}

/* ---- layout switch ---- */
html[data-layout=tablet] .app{max-width:640px}
html[data-layout=tablet] body{font-size:16.5px}
html[data-layout=tablet] .card b{font-size:15.5px}
html[data-layout=tablet] .chips .chip{padding:9px 18px;font-size:15px}
html[data-layout=full] body{background:var(--bg)}
html[data-layout=full] .app{max-width:100%;height:100%;margin:0;border-radius:0;box-shadow:none}
@media(min-width:500px){html[data-layout=full] .app{height:100%;margin:0;border-radius:0;box-shadow:none}}
/* ---- settings rows ---- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(120,120,140,.10);margin-bottom:10px;font-size:14px}
.setrow input[type=range]{-webkit-appearance:none;appearance:none;width:58%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--red) var(--p,45%),rgba(120,120,140,.25) var(--p,45%));outline:none}
.setrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);border:0}
.laychips{display:flex;gap:8px;margin:2px 0 14px}
.laychips button{flex:1;padding:11px 8px;border-radius:14px;background:rgba(120,120,140,.12);font-size:13px;font-weight:700;color:var(--ink);transition:background .3s,color .3s,scale .55s var(--bounce)}
.laychips button.on{background:#111;color:#fff}
/* ---- LiquidTube additions (same language as the shell) ---- */
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb u{position:absolute;right:8px;bottom:8px;z-index:2}
.big{position:relative;display:block;overflow:hidden}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.big>div{position:absolute;left:14px;right:110px;bottom:14px;z-index:2;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.big>div b{display:block;font-size:15px;line-height:1.25;max-height:2.6em;overflow:hidden}
.big>div small{display:block;font-size:12px;opacity:.85;margin-top:3px}
.big:before{content:"";position:absolute;inset:auto 0 0;height:55%;z-index:1;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.big .play{position:absolute;right:12px;bottom:12px;z-index:3}
.chh{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.chh img,.chh .av{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none}
.chh b{font-size:17px}
.mt2{font-size:12.5px;color:var(--mute);margin-top:3px}
.about{margin:10px 0;border-radius:18px;padding:10px 14px;background:rgba(120,120,140,.10)}
.about div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;color:var(--mute)}
.about b{color:var(--ink);font-weight:700}
.desc{font-size:13.5px;line-height:1.5;color:var(--ink);opacity:.86;max-height:132px;overflow:hidden;position:relative;margin-bottom:10px}
.desc:after{content:"";position:absolute;inset:auto 0 0;height:42px;background:linear-gradient(transparent,var(--bg))}
.skl{height:150px;border-radius:20px;margin-bottom:12px;background:linear-gradient(100deg,rgba(120,120,140,.12),rgba(120,120,140,.2),rgba(120,120,140,.12));background-size:200% 100%;animation:skl 1.2s infinite}
@keyframes skl{to{background-position:-200% 0}}
#chlist .card,#shb .card{margin-bottom:12px}
#sg button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute);width:74px;flex:none}
#sg button img,#sg button i{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block;border:2px solid transparent}
#sg button.on img,#sg button.on i{border-color:var(--red)}
#sg button.on{color:var(--ink);font-weight:700}
#sg{display:flex;gap:14px;overflow-x:auto;padding:8px 14px 12px;scrollbar-width:none}
#sg::-webkit-scrollbar{display:none}
#shb{padding-bottom:10px}

/* ---- bounce everywhere ---- */
:where(button,.big){transition:scale .6s var(--bounce)}
button:active,.big:active{scale:.93}
.card:active{scale:.97}
.lens::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.75),transparent 55%);opacity:.55}
.tab:active{scale:.86}
.tab.on svg{animation:tabpop .75s var(--bounce)}
@keyframes tabpop{from{transform:scale(.55) translateY(5px)}to{transform:none}}
.lens.jelly{animation:jelly .75s ease-out}
@keyframes jelly{0%{scale:1 1}28%{scale:1.16 .88}58%{scale:.96 1.05}100%{scale:1 1}}
@keyframes rise{from{opacity:0;transform:translateY(46px) scale(.92)}to{opacity:1;transform:none}}
.card,.big,.res,.cm,.setrow,.laychips,.opt,.about,.chh,.empty{animation:rise .85s var(--bounce) backwards}
.card{animation-delay:calc(var(--i,0)*60ms)}
.car>:nth-child(2),#shb>:nth-child(2),#results>:nth-child(2){animation-delay:.06s}
.car>:nth-child(3),#shb>:nth-child(3),#results>:nth-child(3){animation-delay:.12s}
.car>:nth-child(4),#shb>:nth-child(4),#results>:nth-child(4){animation-delay:.18s}
#shb>:nth-child(5),#results>:nth-child(5){animation-delay:.24s}
#shb>:nth-child(6),#results>:nth-child(6){animation-delay:.3s}
#shb>:nth-child(n+7),#results>:nth-child(n+7){animation-delay:.36s}
.dock{opacity:0}.app.ready .dock{animation:dockin 1.1s var(--bounce) .1s both}
@keyframes dockin{from{opacity:0;transform:translateY(120px) scale(.8)}to{opacity:1;transform:none}}
.top .logo{animation:rise .9s var(--bounce) backwards}
.app:not(.ready) .top .logo,.app:not(.ready) .ic button{animation:none;opacity:0}
.ic button{animation:rise .8s var(--bounce) backwards}.ic button:nth-child(2){animation-delay:.05s}.ic button:nth-child(3){animation-delay:.1s}.ic button:nth-child(4){animation-delay:.15s}
input[type=range]::-webkit-slider-thumb{transition:scale .4s var(--bounce)}
input[type=range]:active::-webkit-slider-thumb{scale:1.3}
.prow{flex-wrap:wrap}.prow button{min-width:calc(33% - 8px);font-size:13px;padding:0 6px}

/* ---- bounce loading + bounce content open ---- */
.ldr{display:flex;gap:9px;justify-content:center;align-items:flex-end;height:36px;padding:8px 0}
.ldr i{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--red),#ff7a5c);animation:hop2 1s infinite}
.ldr i:nth-child(2){animation-delay:.12s}.ldr i:nth-child(3){animation-delay:.24s}
.ldr.abs{position:absolute;inset:0;align-items:center;height:auto;padding:0}
@keyframes hop2{0%,100%{transform:translateY(0) scale(1.2,.8);animation-timing-function:cubic-bezier(.2,.7,.4,1)}45%{transform:translateY(-14px) scale(.92,1.1);animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.94);animation-timing-function:cubic-bezier(.2,.7,.4,1)}45%{transform:translateY(-22px) scale(.97,1.05);animation-timing-function:cubic-bezier(.6,0,.8,.4)}}
#splash{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(70% 22% at 100% 6%,rgba(255,70,110,.22),transparent),radial-gradient(70% 20% at 0% 48%,rgba(70,120,255,.2),transparent),radial-gradient(70% 20% at 100% 85%,rgba(160,80,255,.18),transparent),var(--bg);transition:opacity .45s ease,scale .8s var(--bounce),visibility 0s .8s}
#splash .logo{font-size:30px;gap:12px;animation:hop 1.1s infinite}
#splash .logo i{scale:1.5;margin-right:6px}
#splash.out{opacity:0;scale:1.25;visibility:hidden;pointer-events:none}
img{opacity:0;scale:1.12;transition:opacity .45s ease,scale .9s var(--bounce)}
img.ld{opacity:1;scale:1}
.thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;scale:.92;transition:opacity .45s ease,scale .9s var(--bounce)}
.thumb iframe.ld{opacity:1;scale:1}

function applyGlass(){
  const t=Math.max(0,Math.min(100,+S.opt.glass||0))/100;          // 0 = solid, 1 = very see-through

  root.style.setProperty('--g1','rgba('+base[0]+','+base[1]+','+base[2]+','+a1.toFixed(3)+')');
  root.style.setProperty('--g2','rgba('+base[0]+','+base[1]+','+base[2]+','+a2.toFixed(3)+')');
  root.style.setProperty('--glassBlur',(10+16*t).toFixed(0)+'px');
}

/* ---------- YouTube API ---------- */
async function yt(path,params){
  const q=new URLSearchParams(Object.assign({},params,{key:APIKEY}));
  const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+'?'+q.toString());
  const j=await r.json();
  if(j.error)throw new Error(j.error.message||'YouTube API error');
  return j;
}
const cdn=u=>String(u||'').replace('//yt3.ggpht.com/','//yt3.googleusercontent.com/');
function cObj(c){
  const sn=c.snippet||{},st=c.statistics||{},cd=c.contentDetails||{},br=c.brandingSettings||{};
  return {id:c.id,title:dec(sn.title),av:cdn((sn.thumbnails&&(sn.thumbnails.medium||sn.thumbnails.default)||{}).url),
    handle:sn.customUrl?('@'+String(sn.customUrl).replace(/^@/,'')):'@'+String(sn.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,20),
    subs:st.subscriberCount||'',vids:st.videoCount||'',views:st.viewCount||'',joined:sn.publishedAt||'',country:sn.country||'',
    desc:dec(sn.description||''),up:(cd.relatedPlaylists&&cd.relatedPlaylists.uploads)||'',
    banner:cdn((br.image&&br.image.bannerExternalUrl)||''),trailer:(br.channel&&br.channel.unsubscribedTrailer)||''};
}
async function loadChannels(ids){
  const need=[...new Set((ids||[]).filter(id=>id&&!CH[id]))];
  for(let i=0;i<need.length;i+=50){
    try{
      const j=await yt('channels',{part:'snippet,statistics,contentDetails,brandingSettings',id:need.slice(i,i+50).join(',')});
      (j.items||[]).forEach(c=>{CH[c.id]=cObj(c)});
    }catch(e){}
  }
}
async function ensureChannel(id){
  if(CH[id]&&CH[id].up!==undefined)return CH[id];
  const j=await yt('channels',{part:'snippet,statistics,contentDetails,brandingSettings',id});
  const c=(j.items||[])[0];
  if(!c)throw new Error('Channel not found');
  CH[id]=cObj(c);return CH[id];
}
function vObj(id,d){
  d=d||{};id=id||'';
  const v=Object.assign({id,t:'',c:'',ch:'',views:'',pub:'',cat:'All',g:G[hash(id)%8]},V[id]||{});
  if(d.t)v.t=d.t;if(d.c)v.c=d.c;if(d.ch)v.ch=d.ch;
  if(d.views!=null)v.views=d.views;if(d.pub)v.pub=d.pub;if(d.cat)v.cat=d.cat;
  V[id]=v;return v;
}
async function loadTrending(){
  if(FEED.trending)return FEED.trending;
  try{
    const j=await yt('videos',{part:'snippet,statistics',chart:'mostPopular',regionCode:'IN',maxResults:24});
    const list=(j.items||[]).map(it=>vObj(it.id,{t:dec(it.snippet.title),c:dec(it.snippet.channelTitle),ch:it.snippet.channelId,
      views:it.statistics&&it.statistics.viewCount,pub:it.snippet.publishedAt,
      cat:CATMAP[+it.snippet.categoryId]||'All'}));
    const clean=await dropShorts(list);
    await loadChannels(clean.map(v=>v.ch));
    FEED.trending=clean;return clean;
  }catch(e){FEED.error=e.message||'offline';FEED.trending=[];return []}
}
const feed=()=>FEED.trending||[];
const iso2sec=d=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d||'');return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0};
async function loadDurations(list){
  const ids=list.filter(v=>v.dur==null).map(v=>v.id).slice(0,50);
  if(!ids.length)return;
  try{
    const j=await yt('videos',{part:'contentDetails',id:ids.join(',')});
    (j.items||[]).forEach(it=>{if(V[it.id])V[it.id].dur=iso2sec(it.contentDetails&&it.contentDetails.duration)});
  }catch(e){}
}

/* Long form only. YouTube Shorts can run up to 3 minutes, so anything at or
   under that is treated as a short and never reaches the app. */
const LONG_MIN=180;
const SHORT_RE=/#shorts?\b|\/shorts\//i;
const isShort=v=>!v||SHORT_RE.test(v.t||'')||(typeof v.dur==='number'&&v.dur>0&&v.dur<=LONG_MIN);
async function dropShorts(list){
  list=(list||[]).filter(v=>v&&!SHORT_RE.test(v.t||'')&&!/^(Private|Deleted) video$/i.test(v.t||''));
  await loadDurations(list);                 // every item is measured, not just the unknown ones
  return list.filter(v=>!isShort(v));
}

      {t:dec(it.snippet.title),c:c.title,ch:sh.ch,pub:(it.contentDetails&&it.contentDetails.videoPublishedAt)||it.snippet.publishedAt,cat:sh.title}));

  const t=(v.t||'');
  if(!t)return false;
  if(BADRE.test(t))return false;          // no reaction videos
  if(/\bshorts?\b|#shorts/i.test(t))return false;
  if(/^(Private|Deleted) video$/i.test(t))return false;
  return true;
}

async function loadSection(name){
  if(SEC[name])return SEC[name];
  const cfg=SECTIONS[name];
  try{
    const c=JSON.parse(localStorage.getItem(cfg.key)||'null');
    if(c&&c.at&&Date.now()-c.at<12*36e5&&Array.isArray(c.items)&&c.items.length){
      c.items.forEach(it=>vObj(it.id,it));
      SEC[name]=c.items.map(it=>V[it.id]).filter(Boolean);
      if(SEC[name].length)return SEC[name];
    }
  }catch(e){}

  const out=[];
  for(const chId of cfg.channels){
    try{
      const c=await ensureChannel(chId);
      if(!c.up)continue;
      const j=await yt('playlistItems',{part:'snippet,contentDetails',playlistId:c.up,maxResults:12});
      (j.items||[]).forEach(it=>{
        const v=it.snippet&&it.snippet.resourceId;
        if(!v||!v.videoId)return;
        out.push(vObj(v.videoId,{t:dec(it.snippet.title),c:c.title,ch:chId,
          pub:(it.contentDetails&&it.contentDetails.videoPublishedAt)||it.snippet.publishedAt,
          cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      });
    }catch(e){}
  }
  let clean=await dropShorts(out.filter(keep));
  if(clean.length<8&&cfg.q){
    try{
      const j=await yt('search',{part:'snippet',type:'video',maxResults:20,q:cfg.q,
        videoDuration:'long',relevanceLanguage:'hi',regionCode:'IN',videoEmbeddable:'true'});
      const extra=(j.items||[]).filter(it=>it.id&&it.id.videoId).map(it=>vObj(it.id.videoId,
        {t:dec(it.snippet.title),c:dec(it.snippet.channelTitle),ch:it.snippet.channelId,
         pub:it.snippet.publishedAt,cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      clean=clean.concat(await dropShorts(extra.filter(keep)));
    }catch(e){}
  }
  const seen=new Set();
  clean=clean.filter(v=>!seen.has(v.id)&&seen.add(v.id));
  const hi=v=>/[\u0900-\u097F]|\bhindi\b/i.test(v.t||'')?1:0;
  clean.sort((a,b)=>hi(b)-hi(a));      // Hindi titles first, then the rest
  await loadChannels(clean.map(v=>v.ch));
  SEC[name]=clean;
  try{localStorage.setItem(cfg.key,JSON.stringify({at:Date.now(),
    items:clean.map(v=>({id:v.id,t:v.t,c:v.c,ch:v.ch,pub:v.pub,cat:v.cat}))}))}catch(e){}
  return clean;
}
async function renderSection(name){
  const cfg=SECTIONS[name];
  const box=document.getElementById(cfg.el);
  if(!box)return;
  if(box.dataset.done)return;
  box.innerHTML='<div class="skl"></div><div class="skl"></div><div class="skl"></div>';
  const list2=await loadSection(name);
  box.dataset.done='1';
  if(!list2.length){
    box.innerHTML='<div class="empty">Could not load '+name+' videos right now.<br>Try again in a minute.</div>';
    return;
  }
  box.innerHTML=list2.map(cardOf).join('');
}

let cur=null;
function mount(id,title){

  const f=a.querySelector('iframe');
  f.addEventListener('load',()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'listening'}),'*')}catch(e){}});
}
function play(id){
  const v=V[id];if(!v)return;
  if(isShort(v)){toast('Shorts are turned off');return}
  cur=v;
  $('sheet').classList.remove('on');

  S.vd[id]={id,t:v.t,c:v.c,ch:v.ch,pub:v.pub,views:v.views};
  {const keep=new Set([...S.hist,...S.liked,...S.later]);Object.keys(S.vd).forEach(x=>{if(!keep.has(x))delete S.vd[x]})}
  save();
  mount(id,v.t);

}

/* loop, driven by the player's own message channel (no playlist param) */
addEventListener('message',e=>{
  const o=String(e.origin||'');
  if(!/^https:\/\/(www\.)?youtube(-nocookie)?\.com$/.test(o))return;
  let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return}}
  if(!d||d.event!=='onStateChange')return;
  if(+d.info===0&&S.opt.loop&&cur)mount(cur.id,cur.t);
});

/* ---------- 3D depth: cards tilt under the finger ---------- */
const DEPTH=()=>S.opt.depth!==0;
function applyDepth(){document.documentElement.dataset.depth=DEPTH()?'on':'off'}
applyDepth();

let tiltEl=null;
function tiltStart(e){
  if(!DEPTH())return;
  const card=e.target.closest('.card');
  if(!card||e.pointerType==='mouse')return;
  tiltEl=card;card.classList.add('tilt');
}
function tiltMove(e){
  if(!tiltEl||!DEPTH())return;
  if(!tiltEl.classList.contains('tilt'))tiltEl.classList.add('tilt');
  const r=tiltEl.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width-.5;      // -0.5 .. 0.5
  const py=(e.clientY-r.top)/r.height-.5;
  const rx=(-py*9).toFixed(2), ry=(px*11).toFixed(2);
  tiltEl.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) translateZ(10px) scale(1.015)`;
}
function tiltEnd(){
  if(!tiltEl)return;
  const c=tiltEl;tiltEl=null;
  c.style.transform='';
  setTimeout(()=>c.classList.remove('tilt'),260);
}
/* cards recede slightly as they move away from the centre of the screen */
let depthRaf=0;
function depthScroll(){
  if(!DEPTH())return;
  const vh=innerHeight;
  document.querySelectorAll('.page .card').forEach(c=>{
    if(c.classList.contains('tilt'))return;
    const r=c.getBoundingClientRect();
    if(r.bottom<-80||r.top>vh+80){c.style.transform='';return}
    const d=Math.min(1,Math.abs((r.top+r.height/2)-vh/2)/(vh*0.62));
    c.style.transform=`translateZ(${(-d*30).toFixed(1)}px) scale(${(1-d*0.05).toFixed(3)})`;
    c.style.opacity=(1-d*0.18).toFixed(3);
  });
}
function depthKick(){if(!DEPTH())return;cancelAnimationFrame(depthRaf);depthRaf=requestAnimationFrame(depthScroll)}
document.addEventListener('scroll',depthKick,{capture:true,passive:true});
addEventListener('resize',depthKick);

document.addEventListener('pointerdown',tiltStart,{passive:true});
document.addEventListener('pointermove',tiltMove,{passive:true});
document.addEventListener('pointerup',tiltEnd,{passive:true});
document.addEventListener('pointercancel',tiltEnd,{passive:true});

/* ---------- toast ---------- */
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- dock: glass lens + sliding pages (from the reference) ---------- */
const P=['home','explore','subs'].map(n=>$('p-'+n)),T=['home','explore','subs'],L=['Home','Explore','Subscriptions'],N=T.length;
$('tabrow').innerHTML=T.map((t,i)=>`<button class="tab" tabindex="0" data-i="${i}">${ic(t)}${L[i]}</button>`).join('');
const tabs=$('tabs'),tabEls=[...tabs.querySelectorAll('.tab')];function replay(p){
  [...p.querySelectorAll('.chip,.vh,.card,.big,#sg>button')].slice(0,8).forEach((e,k)=>{e.style.animation='none';void e.offsetWidth;e.style.animation='';e.style.animationDelay=(k*55)+'ms'});
}
let pos=0,press=false,moved=false,sx=0,lastIdx=0;
const clamp=v=>Math.max(0,Math.min(N-1,v));
function render(anim){
  $('app').classList.toggle('drag',!anim);
  P.forEach((p,i)=>{const d=i-pos,a=Math.min(1,Math.abs(d));p.style.transform=`translateX(${d*100}%) scale(${1-a*.05})`;p.style.opacity=1-a*.4;p.inert=Math.abs(d)>.45;p.style.pointerEvents=Math.abs(d)>.45?'none':''});
  $('lens').style.transform=`translateX(${pos*(tabs.clientWidth-10)/N}px) scale(${press?1.18:1})`;
  tabEls.forEach((t,i)=>t.classList.toggle('on',i===Math.round(pos)));
  const idx=Math.round(pos);
  if(idx!==lastIdx){lastIdx=idx;const l=$('lens');l.classList.remove('jelly');void l.offsetWidth;l.classList.add('jelly');replay(P[idx]);
}
}
const at=e=>{const r=tabs.getBoundingClientRect();return clamp((e.clientX-r.left-5)/((r.width-10)/N)-.5)};
tabs.addEventListener('pointerdown',e=>{press=true;moved=false;sx=e.clientX;try{tabs.setPointerCapture(e.pointerId)}catch(_){}const n=Math.round(at(e));if(n===Math.round(pos))P[n].scrollTo({top:0,behavior:'smooth'});pos=n;render(true)});
tabs.addEventListener('pointermove',e=>{if(!press)return;if(Math.abs(e.clientX-sx)>5)moved=true;if(moved){pos=at(e);render(false)}});
const rel=()=>{if(!press)return;press=false;pos=Math.round(pos);render(true)};
tabs.addEventListener('pointerup',rel);tabs.addEventListener('pointercancel',rel);
tabs.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){const n=+t.dataset.i;if(n!==Math.round(pos)){pos=n;render(true)}}});
tabs.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){pos=+e.target.dataset.i;render(true)}});
function go(n){pos=n;render(true)}
addEventListener('resize',()=>render(true));
render(true);
