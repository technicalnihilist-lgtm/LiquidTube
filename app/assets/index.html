<title>LiquidTube</title>
<!-- Warm the two origins the first screen needs, before the 61 KB of markup and
     style below is parsed: the API host (fetched with CORS, so a CORS socket)
     and the thumbnail host (plain <img> requests, so a plain socket). On a cold
     start that is one DNS lookup plus TCP and TLS per origin, and the feed fetch
     and the first thumbnails would otherwise each pay it on their own critical
     path. dns-prefetch first for engines that skip preconnect, preconnect for
     the handshake itself. Neither sends a request, so nothing here can change
     what the app fetches, and both hosts are already on the WebView allowlist. -->
<link rel="dns-prefetch" href="https://www.googleapis.com">
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<style>
:root{--bg:#f3f3f7;--ink:#0b0b0f;--mute:#6c6c78;--g1:rgba(255,255,255,.55);--g2:rgba(255,255,255,.14);--rim:rgba(255,255,255,.95);--shade:rgba(20,20,40,.16);--red:#ff2d3d;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b10;--ink:#f5f5f8;--mute:#9a9aa8;--g1:rgba(90,90,110,.5);--g2:rgba(40,40,55,.2);--rim:rgba(255,255,255,.4);--shade:rgba(0,0,0,.55)}}
:root[data-theme=dark]{--bg:#0b0b10;--ink:#f5f5f8;--mute:#9a9aa8;--g1:rgba(90,90,110,.5);--g2:rgba(40,40,55,.2);--rim:rgba(255,255,255,.4);--shade:rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
@media(min-width:500px){body{background:#cfcfd8}.app{height:min(900px,96%);margin-top:2vh;border-radius:44px;box-shadow:0 30px 80px #0005}}

/* ===== liquid glass ===== */
.glass{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(var(--glassBlur,16px)) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(var(--glassBlur,16px)) saturate(190%) brightness(1.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1.5px 1px var(--rim),inset 0 -1.5px 1px rgba(255,255,255,.22),0 10px 30px var(--shade)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.6),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.3));opacity:.5}

.page{position:absolute;inset:0;z-index:0;overflow-y:auto;overflow-x:hidden;padding-bottom:150px;scrollbar-width:none;background:radial-gradient(70% 22% at 100% 6%,rgba(255,70,110,.22),transparent),radial-gradient(70% 20% at 0% 48%,rgba(70,120,255,.2),transparent),radial-gradient(70% 20% at 100% 85%,rgba(160,80,255,.18),transparent),var(--bg);transition:transform .95s var(--bounce-soft),opacity .45s ease}
/* A page only moves while a tab change is sliding it, so the layer hint is a
   class the dock puts on for the length of that slide (see `pageHint`) instead
   of a permanent promise on all three pages. */
.page.anim{will-change:transform,opacity}
.page::-webkit-scrollbar{display:none}.drag .page{transition:none}

.row{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px;letter-spacing:-.04em}
.logo i{width:30px;height:21px;border-radius:6px;background:var(--red);position:relative}

.tabrow{position:absolute;inset:5px;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);transition:color .3s,scale .55s var(--bounce)}
.tab.on{color:var(--red)}.tab svg{width:22px;height:22px}
.sbtn{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;transition:scale .6s var(--bounce)}.sbtn:active{scale:.86}
@media(prefers-reduced-motion:reduce){:root{--bounce:cubic-bezier(.25,.9,.3,1);--bounce-soft:cubic-bezier(.25,.9,.3,1)}.skl{animation:none}}

/* ---- overlays: off-screen until the deferred sheet lands ---- */
/* #search, #pl, #sheet, #scrim and #toast are revealed only by their `.on`
   class, so keeping them hidden here cannot change the UI. It only stops them
   painting as bare flow content in the first frames, before the deferred sheet
   (which carries their positioning) has been applied. */
#search:not(.on),#pl:not(.on),#sheet:not(.on),#scrim:not(.on),#toast:not(.on){position:absolute;opacity:0;pointer-events:none}

#splash .logo{font-size:30px;gap:12px;animation:hop 1.1s infinite}

.skl:nth-child(2){animation-delay:.08s,0s}.skl:nth-child(3){animation-delay:.16s,0s}
.car .skl{flex:none;width:86%;height:230px;border-radius:30px;margin-bottom:0}

/* ---------- surfaces, and the listeners that belong to them (item 4.3) ----------
   The app is one document with three tab pages that are never rebuilt and four
   overlays that are opened and closed all session (the player, the sheet, the
   search panel, the scrim), so a listener is only a leak if the surface it serves
   can go away while the listener stays. A census of the build says most of them
   cannot: the tab strip, the chip row, `#sg`, `#sheet`, `#shb` and the player's
   own buttons are static nodes that live as long as the document, and everything
   the app does with a card or a shelf is delegated from `document` or from one of
   those containers. Those are registered once at boot and correctly stay.

   The exception is the player, which is the one surface that builds fresh DOM per
   use: `mount()` creates an iframe and attached a `load` listener to it, and it
   runs again on every play (a second video while the player is open) and again on
   every loop wrap — so a session of N plays left N handlers on N detached
   iframes, each of which would still post into a media pipeline that had been
   thrown away if its load landed late. Beside it, the window `message` bridge —
   the channel that implements Loop — was registered at parse time and ran its
   origin test and JSON parse for every message any frame ever posted, including
   before a player had ever been opened.

   So a listener that belongs to a surface is registered through `ltOn(owner,…)`
   and taken off in one call, `ltOff(owner)`, when that surface is torn down. The
   registry keeps the exact argument list (target, type, fn, the same options
   object) so `removeEventListener` matches, and it holds no reference to any
   element the app does not already hold. `window.__ltSurfaces()` returns the
   census — registered, removed, live, and live per owner — which is what
   tools/page-teardown-check.js reads. */
const LT_OWN=new Map();                 /* owner -> flat [target,type,fn,opts,...] */
const LT_ST={on:0,off:0};
function ltOn(owner,target,type,fn,opts){
  target.addEventListener(type,fn,opts);
  const a=LT_OWN.get(owner);
  if(a)a.push(target,type,fn,opts);else LT_OWN.set(owner,[target,type,fn,opts]);
  LT_ST.on++;
}
function ltOff(owner){
  const a=LT_OWN.get(owner);
  if(!a)return 0;
  LT_OWN.delete(owner);
  for(let i=0;i<a.length;i+=4){try{a[i].removeEventListener(a[i+1],a[i+2],a[i+3])}catch(e){}}
  const n=a.length/4;
  LT_ST.off+=n;
  return n;
}
window.__ltSurfaces=()=>{                /* the census: nothing on screen reads it */
  const owners={};
  LT_OWN.forEach((a,k)=>{owners[k]=a.length/4});
  return {on:LT_ST.on,off:LT_ST.off,live:LT_ST.on-LT_ST.off,owners:owners};
};

/* ---------- storage codec: LZW over the UTF-8 bytes ----------
   Everything this app persists — the state, the last feed, the three section
   caches — is JSON whose keys repeat 12-60 times, so one LZW pass over its
   UTF-8 bytes takes roughly half of it away before it reaches localStorage:
   less to stringify, less to write, less to re-read and parse on the next
   launch, and more headroom under the ~5 MB origin quota (item 2.8).
   It is plain synchronous JS: no CompressionStream (absent before Chrome 80,
   and async, which a save path cannot be), no library, no request.
   A stored value is prefixed: 'z1:' means LZW, anything else is the plain JSON
   that every earlier build wrote — so old data still loads unchanged and
   nothing has to be migrated. Codes are emitted as single UTF-16 units mapped
   out of the surrogate range (code >= 0xD800 is written +0x800), so a blob is
   always well-formed UTF-16 and survives an engine that stores localStorage as
   UTF-8; the dictionary stops growing at Z_MAX so every code stays in that map
   and the encoder and decoder stop adding entries at exactly the same point. */
const Z_PREFIX='z1:',Z_MAX=0xF000,TE=new TextEncoder(),TD=new TextDecoder();
const zMap=c=>c<0xD800?c:c+0x800;         // code -> UTF-16 unit, out of the surrogate range
const zCode=c=>c>=0xE000?c-0x800:c;
function lzwPack(s){
  const b=TE.encode(s),n=b.length;
  if(!n)return '';
  const out=[];let dict=new Map(),next=256,pre=b[0];
  for(let i=1;i<n;i++){
    const c=b[i],k=pre*256+c,got=dict.get(k);
    if(got!==undefined){pre=got;continue}
    out.push(pre);
    if(next<Z_MAX)dict.set(k,next++);          // full: keep coding with what we have
    pre=c;
  }
  out.push(pre);
  let str='';
  for(let i=0;i<out.length;i+=4096){
    const part=out.slice(i,i+4096);
    for(let j=0;j<part.length;j++)part[j]=zMap(part[j]);
    str+=String.fromCharCode.apply(null,part);
  }
  return str;
}
function lzwUnpack(str){
  const n=str.length;
  if(!n)return '';
  /* entries are kept as one-byte-per-char strings: appending is cheap on a rope
     and each new entry is just the previous one plus a char, where an array of
     bytes would copy its whole tail on every step. One pass to bytes at the end. */
  const dict=new Array(256);
  for(let i=0;i<256;i++)dict[i]=String.fromCharCode(i);
  let next=256,prev='',out='';
  for(let i=0;i<n;i++){
    const code=zCode(str.charCodeAt(i));
    let entry;
    if(code<next&&dict[code]!==undefined)entry=dict[code];
    else if(code===next&&prev)entry=prev+prev[0];
    else throw new Error('bad code');
    out+=entry;
    if(prev&&next<Z_MAX)dict[next++]=prev+entry[0];
    prev=entry;
  }
  const b=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i);
  return TD.decode(b);
}
/* storeJSON: the string to hand to setItem. Compressed only when it is really
   smaller, so a tiny or incompressible value is stored exactly as before. */
function storeJSON(o){
  const plain=JSON.stringify(o);
  try{
    const z=lzwPack(plain);
    if(z.length<plain.length)return Z_PREFIX+z;
  }catch(e){}

}
/* loadJSON: the parsed value, or `fallback` for empty, corrupt or half-written
   data. Accepts both the compressed form and the plain JSON of earlier builds. */
function loadJSON(raw,fallback){
  if(raw==null||raw==='')return fallback;
  try{
    const z=raw.slice(0,3)===Z_PREFIX;
    const v=JSON.parse(z?lzwUnpack(raw.slice(3)):raw);
    return v==null?fallback:v;
  }catch(e){return fallback}
}

/* ---------- the saved library, bounded (item 4.5) ----------
   `hist`, `liked` and `later` are the three lists the Library sheet draws and
   the player resolves back through V. History was already trimmed to 100 in
   `play()`, but the trim lived at that one call site and nothing did it for
   liked or later: every heart and every save appended an id and nothing ever
   took one out. They are the only lists here that a user can grow without
   bound — a year of use is thousands of ids — and they are written to
   localStorage on every change, so the growth showed up three times over: in
   the heap, in the saved blob, and in the work `save()` does.
   All three now have a ceiling, applied in one place (`capOne`) so no call site
   can forget it, and applied again once at boot so a blob written by an older
   build is trimmed as it loads. The newest entries are the ones kept: history
   is newest-first (unshift), liked and later are newest-last (push), so a cap
   drops from the old end of each. Nothing on screen changes — the sheet draws
   the same list, just without the ids too old to have been reachable anyway. */

/* ---------- YouTube API ---------- */
/* Every API call goes through one request cache. The key is the path plus the
   sorted parameters with `key` left out, so two calls that would send the same
   query share one entry, and each entry carries a TTL chosen per endpoint: a
   channel's metadata and a video's duration are good for hours, an upload list
   for half an hour, the trending chart and a search for ten minutes. A repeat
   inside that window is answered from memory — no round trip, no quota unit —
   which is what the search box (a call per keystroke), a shelf's "View All"
   (the same search again), a reopened channel sheet and a chip tapped twice
   all hit. Only a successful response is stored: a throw, a 500 or a quota
   refusal leaves no entry, so the next call retries instead of serving the
   failure. The map is capped at RQ_MAX entries and evicts the oldest first, so
   it cannot grow with the number of distinct queries typed in a session. The
   stored object is handed straight to the caller, which only reads it: every
   call site maps or filters `items` into objects of its own.

   A call that is still on the wire is shared, not repeated. `RQI` holds the
   promise of every request that has been sent but has not answered yet, under
   the same key, so a second call for the same query before the first returns
   joins it instead of spending another round trip and another quota unit. The
   slot is cleared the moment the response lands (or the request fails), and a
   success has already been put in `RQ` by then, so the next call is an ordinary
   cache hit and a failure leaves nothing behind to block a retry. Two callers
   share one parsed response object, which is exactly what a cache hit already
   hands out — every call site only reads it. This is what makes a double tap
   free: a chip tapped twice while its section is loading, "View All" pressed
   again before the shelf's search comes back, the same query retyped inside one
   round trip, a channel sheet reopened while the first is still fetching.

   A request that fails for a transient reason is tried once more, after an
   exponential backoff, before the failure is handed to the caller. Transient
   means a 5xx, a 429, or a fetch that never got a response at all (offline, DNS,
   a reset connection, TLS). A 4xx is an answer, not a glitch — a revoked key, a
   quota refusal, a not-found — so it is never repeated. The retry lives inside
   the in-flight promise, so callers that joined a request also wait for its
   retry and still share one result, and only a success is written to the cache.

   How long an entry stays good is the endpoint table below (rqTtl) unless the
   response itself says otherwise. A caching header on the response —
   Cache-Control, Pragma, or the older Expires/Date pair — is honoured instead,
   and can only ever shorten that window, never lengthen it (rqHdrFresh).

   A request can also belong to a page. `yt(path, params, 'explore')` tags it
   with the tab whose DOM its answer is rendered into, and every tab change
   (pageSwitch, called from render) narrows the set of pages the app is filling
   to the tab the user is on: a request whose owning page is not in that set, and
   that no page in it is waiting for either, is aborted through an AbortController
   — the connection closes, the body is never parsed, nothing is cached, and no
   quota is spent on a list nobody is looking at any more. A tagged call for a
   page outside the set is not even sent, so a half-finished chain (a shelf that
   was waiting on a shared channel lookup) stops at its next step instead of
   firing one more request for a tab nobody is on. Every owner of such a request
   already tolerates a failure (a shelf's promise is caught in paintShelf, a
   section's in chip) and every page re-drives whatever it never got when it is
   entered again (exploreResume, homeResume), so what the user finally sees is
   unchanged. Never abandoned: a request nobody tagged (the feed, the channel
   queue, durations, the search box, the player — shared or needed everywhere), a
   request an untagged caller has joined (it is no longer one page's private
   work), and a request the page now on screen is waiting for. Without
   AbortController the tagging is inert and every request runs to completion
   exactly as before. */
const RQ=new Map(),RQ_MAX=48,RQ_ST={hit:0,miss:0,evict:0,join:0,retry:0,retryOk:0,retryFail:0,hdr:0,keep:0,abort:0};
const RQI=new Map();                                               /* key -> {p, ac, own} on the wire */
const RQ_TTL_SEARCH=6e5,RQ_TTL_CHART=6e5,RQ_TTL_UPLOADS=18e5,RQ_TTL_CHANNEL=6*36e5,RQ_TTL_DUR=12*36e5;
function rqTtl(path,params){
  if(path==='channels')return RQ_TTL_CHANNEL;                       /* title, avatar, subs */
  if(path==='videos')return (params&&params.chart)?RQ_TTL_CHART:RQ_TTL_DUR;  /* chart vs durations */
  if(path==='playlistItems')return RQ_TTL_UPLOADS;
  if(path==='search')return RQ_TTL_SEARCH;
  return RQ_TTL_CHART;
}
function rqKey(path,params){
  const q=new URLSearchParams(params||{}),parts=[];
  q.forEach((v,k)=>{if(k!=='key')parts.push(k+'='+v)});
  parts.sort();                                                    /* order of the call does not matter */
  return path+'?'+parts.join('&');
}
function rqGet(k,now){
  const e=RQ.get(k);
  if(!e)return null;
  if(now-e.at>=e.ttl){RQ.delete(k);return null}                    /* stale: dropped on read, no timer */
  return e.j;
}
function rqPut(k,j,ttl,now){
  if(RQ.size>=RQ_MAX){                                             /* bound: oldest insertion goes first */
    const o=RQ.keys().next();
    if(!o.done){RQ.delete(o.value);RQ_ST.evict++}
  }
  RQ.set(k,{at:now,ttl,j});
}
window.__ltReqCache=()=>({size:RQ.size,max:RQ_MAX,hit:RQ_ST.hit,miss:RQ_ST.miss,evict:RQ_ST.evict,join:RQ_ST.join,retry:RQ_ST.retry,retryOk:RQ_ST.retryOk,retryFail:RQ_ST.retryFail,hdr:RQ_ST.hdr,keep:RQ_ST.keep,abort:RQ_ST.abort,fly:RQI.size});

/* ---------- quota meter (item 2.9) ----------
   The project's key has Q_LIMIT units a day and a search costs a hundred of
   them, so a hundred searches is the whole day gone and everything else comes
   back refused until the quota resets. That ceiling is the API's, not the
   app's, and the app cannot lift it — but it can say where it stands, which is
   what was missing: how many units this build spent today, on which endpoint,
   over how many requests, and how many refusals it took.

   Nothing here is on screen. The meter is read through window.__ltQuota(), one
   object with the same shape every time, and written out as a single `lt-quota`
   console line, which MainActivity forwards to logcat; no node, class, style or
   layout is touched, so the UI is exactly what it was before.

   Only a request that actually leaves is counted. A cache hit, a joined
   in-flight call, and a call refused before it was sent (its page is not on
   screen) cost nothing and add nothing. A retry is a second request on the wire
   and counts as one. A request aborted after it left still counts, and so does
   a fetch that never reached the server: both are the conservative side, and
   over-counting only makes a warning early where under-counting loses a day.

   The day is the local calendar day, and a stored meter from an earlier day is
   filed into a short history (Q_DAYS entries, oldest dropped) rather than added
   to today's — a restart never carries yesterday's units into today's total, and
   the history cannot grow with the number of launches. It persists through the
   same codec as everything else (item 2.8) under its own key, written on a
   coalesced timer instead of per request — a save is a synchronous encode plus a
   localStorage write and should not ride on every call — and flushed at once
   when the page is hidden or goes away, so a close loses at most Q_SAVE_MS of
   accounting. */
const QKEY='lt_quota',Q_LIMIT=1e4,Q_DAYS=7,Q_SAVE_MS=1e3,Q_EP_MAX=12;
/* the API's published cost per call, in units; every other endpoint this app
   uses is a 1-unit read, which is the default in qCost() */
const Q_COST={search:100,videos:1,channels:1,playlistItems:1,playlists:1,videoCategories:1,commentThreads:1,comments:1,captions:1};
const Q={day:'',units:0,req:0,refused:0,warn:0,ep:{},hist:[]};
let qTimer=0,qDirty=0;
const qPad=n=>(n<10?'0':'')+n;

    const c=await ensureChannel(sh.ch);
    if(!pageWanted('explore'))throw rqAbort();   /* left Explore while the channel was loading */
    if(!c.up)throw new Error('no uploads');
    const j=await yt('playlistItems',{part:'snippet,contentDetails',playlistId:c.up,maxResults:10},'explore');
    list=(j.items||[]).filter(it=>it.snippet&&it.snippet.resourceId).map(it=>vObj(it.snippet.resourceId.videoId,
      {t:dec(it.snippet.title),c:c.title,ch:sh.ch,pub:(it.contentDetails&&it.contentDetails.videoPublishedAt)||it.snippet.publishedAt,cat:sh.title}));
  }else{
    const j=await yt('search',{part:'snippet',type:'video',maxResults:10,q:sh.q},'explore');
    list=(j.items||[]).filter(it=>it.id&&it.id.videoId).map(it=>vObj(it.id.videoId,
      {t:dec(it.snippet.title),c:dec(it.snippet.channelTitle),ch:it.snippet.channelId,pub:it.snippet.publishedAt,cat:sh.title}));
    if(!pageWanted('explore'))throw rqAbort();
    await loadChannels(list.map(v=>v.ch));
  }
  list=await dropShorts(list);
  SHELF[sh.id]=list;return list;
}
/* the carousel placeholders, used both for the boot skeleton and by renderExplore */
const shelfSkeleton=()=>SHELVES.map(sh=>'<div class="vh"><h2>'+esc(sh.title)+'</h2><button class="va glass" data-shelf="'+sh.id+'">View All</button></div>'+
  '<div class="car" id="car-'+sh.id+'"><div class="skl"></div><div class="skl"></div></div>').join('');
/* A shelf's load is tagged 'explore' (see loadShelf), so it can be abandoned
   when the user leaves Explore. SHELF_BUSY keeps a shelf that is already on the
   wire from being started twice when Explore is re-entered, and the abort path
   leaves the placeholder alone instead of blanking the carousel — exploreResume
   re-runs it the moment the tab is on screen again. */
const SHELF_BUSY=new Set();
function fillShelf(sh,list){
  const el=document.getElementById('car-'+sh.id);
  if(!el)return;
  el.innerHTML=list.slice(0,6).map(v=>'<div class="big" data-v="'+esc(v.id)+'"><img src="'+THUMB_BASE+esc(v.id)+'/hqdefault.jpg" alt=""><div><b>'+esc(v.t)+'</b><small>'+esc(v.c)+'</small></div><button class="play glass" data-v="'+esc(v.id)+'">'+PLAY_IC+'Play</button></div>').join('');
}
function paintShelf(sh){
  if(SHELF_BUSY.has(sh.id))return;           /* already on the wire: it fills itself */
  SHELF_BUSY.add(sh.id);
  loadShelf(sh).then(list=>{SHELF_BUSY.delete(sh.id);fillShelf(sh,list)})
    .catch(e=>{
      SHELF_BUSY.delete(sh.id);
      if(e&&e.name==='AbortError')return;    /* the page was left: exploreResume picks it up again */
      asSafe('shelf.'+sh.id,e);              /* counted and logged; the carousel is emptied below */
      const el=document.getElementById('car-'+sh.id);if(el)el.innerHTML='';
    });
}
function renderExplore(){
  $('ex').innerHTML=shelfSkeleton();
  SHELVES.forEach(paintShelf);
}
/* entering Explore again: only the shelves that never landed are re-driven, so
   the ones already on screen are untouched */
function exploreResume(){
  SHELVES.forEach(sh=>{if(!SHELF[sh.id])paintShelf(sh)});
}

const SECTIONS={

  }
};
const SEC={};

function keep(v){
  const t=(v.t||'');
  if(!t)return false;
  if(BADRE.test(t))return false;          // no reaction videos

async function loadSection(name){
  if(SEC[name])return SEC[name];
  const cfg=SECTIONS[name];
  try{
    const c=loadJSON(localStorage.getItem(cfg.key),null);
    if(c&&c.v===CVER&&c.at&&Date.now()-c.at<12*36e5&&Array.isArray(c.items)&&c.items.length){
      c.items.forEach(it=>vObj(it.id,it));
      SEC[name]=c.items.map(it=>V[it.id]).filter(Boolean);
      if(SEC[name].length)return SEC[name];
    }
  }catch(e){}

  const out=[];
  for(const chId of cfg.channels){
    if(!pageWanted('home'))throw rqAbort();      /* left the page: stop, homeResume re-runs the section */
    try{
      const c=await ensureChannel(chId);
      if(!c.up)continue;
      const j=await yt('playlistItems',{part:'snippet,contentDetails',playlistId:c.up,maxResults:12},'home');
      (j.items||[]).forEach(it=>{
        const v=it.snippet&&it.snippet.resourceId;
        if(!v||!v.videoId)return;
        out.push(vObj(v.videoId,{t:dec(it.snippet.title),c:c.title,ch:chId,
          pub:(it.contentDetails&&it.contentDetails.videoPublishedAt)||it.snippet.publishedAt,
          cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      });
    }catch(e){if(e&&e.name==='AbortError')throw e}   /* abandoned: stop the whole section */
  }
  let clean=await dropShorts(out.filter(keep));
  if(clean.length<8&&cfg.q){
    try{
      const j=await yt('search',{part:'snippet',type:'video',maxResults:20,q:cfg.q,
        videoDuration:'long',relevanceLanguage:'hi',regionCode:'IN',videoEmbeddable:'true'},'home');
      const extra=(j.items||[]).filter(it=>it.id&&it.id.videoId).map(it=>vObj(it.id.videoId,
        {t:dec(it.snippet.title),c:dec(it.snippet.channelTitle),ch:it.snippet.channelId,
         pub:it.snippet.publishedAt,cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      clean=clean.concat(await dropShorts(extra.filter(keep)));
    }catch(e){if(e&&e.name==='AbortError')throw e}
  }
  const seen=new Set();
  clean=clean.filter(v=>!seen.has(v.id)&&seen.add(v.id));
  const hi=v=>HINDI_RE.test(v.t||'')?1:0;
  clean.sort((a,b)=>hi(b)-hi(a));      // Hindi titles first, then the rest
  await loadChannels(clean.map(v=>v.ch));
  SEC[name]=clean;
  try{localStorage.setItem(cfg.key,storeJSON({v:CVER,at:Date.now(),
    items:clean.map(v=>({id:v.id,t:v.t,c:v.c,ch:v.ch,pub:v.pub,cat:v.cat}))}))}catch(e){}
  return clean;
}
async function renderSection(name){
  const cfg=SECTIONS[name];
  const box=document.getElementById(cfg.el);
  if(!box)return;
  if(box.dataset.done)return;
  box.innerHTML='<div class="skl"></div><div class="skl"></div><div class="skl"></div>';
  let list2;
  try{list2=await loadSection(name)}
  catch(e){
    if(e&&e.name==='AbortError')return;   /* left the page: leave it undone, retry later */
    /* A section that failed to load is not an error the user should ever see
       twice: the box gets the same sentence the empty branch below writes, and
       `dataset.done` is deliberately not set, so the next visit re-runs the
       section instead of showing a dead box for the rest of the session. This
       used to re-throw — and renderSection is a promise nobody holds, so the
       rejection went nowhere and the skeletons stayed on screen for good. */
    asSafe('section.render.'+name,e);
    box.innerHTML='<div class="empty">Could not load '+name+' videos right now.<br>Try again in a minute.</div>';
    return;
  }
  box.dataset.done='1';
  if(!list2.length){
    box.innerHTML='<div class="empty">Could not load '+name+' videos right now.<br>Try again in a minute.</div>';
    return;
  }
  box.innerHTML=list2.map(cardOf).join('');
}

/* ---------- player ---------- */
let cur=null;
/* Taking a frame down is two steps, not one. Emptying `.art` detaches the embed,
   and a detached frame is not a stopped one: the <video> inside it keeps its
   decoder, its audio route and its playing state until the renderer collects
   the frame, which on a WebView can be well after the panel has slid away —
   long enough to hear a video that is no longer on screen. So the frame is
   navigated off the embed first (`about:blank`), which unloads the player
   document and drops its media element, and only then is the box emptied. One
   helper because there are two ways a frame goes: `mount()` replaces it on the
   next play or on a loop wrap, `closeAll()` closes the player (item 4.4). */
function dropFrame(){
  const a=$('pl').querySelector('.art');
  const f=a&&a.querySelector('iframe');
  if(f){try{f.src='about:blank'}catch(e){}}
  if(a)a.innerHTML='';
  return a;
}
/* The player's two listeners belong to the player and are taken off with it:
   `ltOff('pl')` runs at the top of every mount (so a play, a replay or a loop
   wrap leaves the previous iframe's handler behind with the iframe) and in
   `closeAll` (so a closed player holds nothing). The bridge is registered with
   the player rather than at parse time, which is also one fewer listener on the
   document for the whole session for a user who never opens a video. */
function mount(id,title){
  ltOff('pl');
  const a=dropFrame();
  if(!a)return;
  a.innerHTML=LDRABS+'<iframe src="'+EMBED_BASE+esc(id)+'?autoplay=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1'+(S.opt.cc?'&cc_load_policy=1':'')+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="'+esc(title||'')+'"></iframe>';
  const f=a.querySelector('iframe');
  ltOn('pl',f,'load',()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'listening'}),'*')}catch(e){}});
  ltOn('pl',window,'message',onYtMsg);
}
function play(id){
  const v=V[id];if(!v)return;
  if(isShort(v)){toast('Shorts are turned off');return}
  cur=v;
  $('sheet').classList.remove('on');
  S.hist=S.hist.filter(x=>x!==id);S.hist.unshift(id);capHead(S.hist);
  S.vd[id]={id,t:v.t,c:v.c,ch:v.ch,pub:v.pub,views:v.views};
  {const keep=new Set([...S.hist,...S.liked,...S.later]);Object.keys(S.vd).forEach(x=>{if(!keep.has(x))delete S.vd[x]})}
  save();
  mount(id,v.t);
  $('ptitle').textContent=v.t;
  $('pmeta').textContent=v.c+(v.views?' · '+num(v.views)+' views':'')+(v.pub?' · '+ago(v.pub):'');
  $('ppp').textContent=S.liked.includes(id)?'Liked':'Like';
  $('plk').textContent='Channel';
  $('pl').classList.add('on');$('scrim').classList.add('on');slideHint();
  /* The meta line is redrawn once the channel is known — it adds nothing to the
     screen that is not already there, only the avatar-backed title. This was the
     last `.then` in the app with no rejection handler at all: an element missing
     from the DOM made the handler throw into nowhere, and the video still played
     with a line that was never updated and no trace of why. Guarded, with the
     line it already shows as the fallback, so a failure costs the redraw and
     nothing else (item 5.1). */
  if(v.ch)asWatch('play.channel',loadChannels([v.ch]).then(()=>{
    if(cur&&cur.id===id)$('pmeta').textContent=v.c+(v.views?' · '+num(v.views)+' views':'')+(v.pub?' · '+ago(v.pub):'');
  }));
}
$('ppp').onclick=()=>{if(!cur)return;toggle(S.liked,cur.id);$('ppp').textContent=S.liked.includes(cur.id)?'Liked':'Like'};
/* The channel id is read before the close: `closeAll()` drops `cur`, so reading
   `cur.ch` after it would be reading a player that no longer exists. */
$('plk').onclick=()=>{if(!cur||!cur.ch)return;const ch=cur.ch;closeAll();openChannel(ch)};
$('psave').onclick=()=>{if(!cur)return;const on2=toggle(S.later,cur.id);toast(on2?'Saved to Watch later':'Removed from Watch later')};
$('pcm').onclick=()=>{if(!cur)return;closeAll();sheet('Comments','<div class="empty">Comments open on YouTube for this video.</div>',0)};
$('pclose').onclick=closeAll;

/* loop, driven by the player's own message channel (no playlist param). Named
   rather than anonymous because it is registered and removed with the player
   (item 4.3): while no video is open there is no bridge and no frame that could
   post to it. */
function onYtMsg(e){
  const o=String(e.origin||'');
  if(!YT_ORIGIN_RE.test(o))return;
  let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return}}
  if(!d||d.event!=='onStateChange')return;
  if(+d.info===0&&S.opt.loop&&cur)mount(cur.id,cur.t);
}

/* ---------- sheets ---------- */
/* Every write of a sheet takes a generation, so a surface that is gone cannot be
   written into by an answer that is still on the wire. `sheet()` is the one place
   a sheet's content is replaced, and `closeAll()` is the one place it is taken
   away, so both raise `shGen`; the channel loader (the only sheet content that
   arrives asynchronously) reads it once and drops its writes if it moved. Without
   that, opening a channel and then closing it — or tapping Settings — inside the
   request window let the channel's answer paint itself into whatever sheet was on
   screen by then (item 4.3: the page's teardown reaches its in-flight work too). */
let shGen=0;
function sheet(t,h,inp){
  shGen++;
  $('sht').textContent=t;$('shb').innerHTML=h;$('shi').classList.toggle('on',!!inp);
  $('sheet').classList.add('on');$('scrim').classList.add('on');slideHint();
}
/* The overlays are the largest surfaces that animate: the player and the sheet
   are full-width blurred panels that slide .9 s, the search panel .85 s, and the
   scrim fades .35 s. `slideHint` covers the longest of those and takes the hint
   off again, so an overlay that is sitting open costs nothing.
   Every place that flips `.on` on one of them calls it; `closeAll` is the one
   path all the closes go through. */
const SLIDE_IDS=['search','pl','sheet','scrim'],SLIDE_HINT_MS=1000;
let slideT=0;
function slideHint(){
  const els=SLIDE_IDS.map($);
  for(let i=0;i<els.length;i++)els[i].classList.add('slide');
  clearTimeout(slideT);slideT=setTimeout(()=>{for(let i=0;i<els.length;i++)els[i].classList.remove('slide')},SLIDE_HINT_MS);
}
/* Closing takes the frame down through `dropFrame()` (so the media pipeline is
   released, not just detached) and drops `cur` with it: the Like, Save, Channel
   and Comments buttons all guard on `cur`, so a closed player can no longer be
   acted on, and nothing in the app still holds the video it was showing. */
function closeAll(){ltOff('pl');shGen++;['sheet','pl'].forEach(i=>$(i).classList.remove('on'));$('scrim').classList.remove('on');dropFrame();cur=null;slideHint()}
$('scrim').onclick=closeAll;
$('shb').addEventListener('click',e=>{
  const s=e.target.closest('[data-chsub]');
  if(s){const on2=toggle(S.subs,s.dataset.chsub);s.textContent=on2?'Subscribed':'Subscribe';toast(on2?'Subscribed':'Unsubscribed');return}
  const l=e.target.closest('[data-lib]');
  if(l){
    const k=l.dataset.lib;
    if(k==='clear'){S.hist=[];save();toast('History cleared');closeAll();return}
    if(k==='settings'){sheet('Settings',settingsHTML(),0);return}
    const ids=k==='hist'?S.hist:k==='liked'?S.liked:S.later;
    sheet(k==='hist'?'History':k==='liked'?'Liked videos':'Watch later',
      ids.length?ids.map(id=>V[id]?cardOf(V[id]):'').join(''):'<div class="empty">Nothing saved yet.</div>',0);
  }
  const o=e.target.closest('[data-opt]');
  if(o){const k=o.dataset.opt;S.opt[k]=S.opt[k]?0:1;save();if(k==='depth')applyDepth();
    if(k==='parallax')applyParallax();
