<!-- Warm the two origins the first screen needs, before the 61 KB of markup and
     style below is parsed: the API host (fetched with CORS, so a CORS socket)
     and the thumbnail host (plain <img> requests, so a plain socket). On a cold
     start that is one DNS lookup plus TCP and TLS per origin, and the feed fetch
     and the first thumbnails would otherwise each pay it on their own critical
     path. dns-prefetch first for engines that skip preconnect, preconnect for
     the handshake itself. Neither sends a request, so nothing here can change
     what the app fetches, and both hosts are already on the WebView allowlist. -->
<link rel="dns-prefetch" href="https://www.googleapis.com">
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<style>
:root{--bg:#f3f3f7;--ink:#0b0b0f;--mute:#6c6c78;--g1:rgba(255,255,255,.55);--g2:rgba(255,255,255,.14);--rim:rgba(255,255,255,.95);--shade:rgba(20,20,40,.16);--red:#ff2d3d;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b10;--ink:#f5f5f8;--mute:#9a9aa8;--g1:rgba(90,90,110,.5);--g2:rgba(40,40,55,.2);--rim:rgba(255,255,255,.4);--shade:rgba(0,0,0,.55)}}
:root[data-theme=dark]{--bg:#0b0b10;--ink:#f5f5f8;--mute:#9a9aa8;--g1:rgba(90,90,110,.5);--g2:rgba(40,40,55,.2);--rim:rgba(255,255,255,.4);--shade:rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
@media(min-width:500px){body{background:#cfcfd8}.app{height:min(900px,96%);margin-top:2vh;border-radius:44px;box-shadow:0 30px 80px #0005}}

@supports (transition-timing-function:linear(0,1)){:root{--bounce:linear(0,0.0425,0.1522,0.3038,0.4746,0.6461,0.8042,0.9394,1.0463,1.1231,1.1711,1.1935,1.1946,1.1797,1.1539,1.1219,1.0879,1.0551,1.0259,1.0017,0.9834,0.9709,0.9638,0.9614,0.9628,0.9668,0.9725,0.9791,0.9857,0.9919,0.9972,1.0014,1.0045,1.0065,1.0074,1.0075,1.007,1.006,1.0048,1.0035,1.0022,1.0011,1.0002,0.9994,1);--bounce-soft:linear(0,0.0207,0.0751,0.1527,0.2448,0.3442,0.4451,0.5432,0.6352,0.7191,0.7935,0.8578,0.912,0.9563,0.9915,1.0183,1.0379,1.0511,1.0591,1.0628,1.0631,1.0608,1.0567,1.0513,1.0452,1.0389,1.0325,1.0265,1.0208,1.0158,1.0113,1.0075,1.0043,1.0018,0.9998,0.9983,0.9972,0.9965,0.9961,0.996,0.9961,0.9962,0.9965,0.9969,1)}}
/* ===== liquid glass ===== */
.glass{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(var(--glassBlur,16px)) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(var(--glassBlur,16px)) saturate(190%) brightness(1.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1.5px 1px var(--rim),inset 0 -1.5px 1px rgba(255,255,255,.22),0 10px 30px var(--shade)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.6),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.3));opacity:.5}

.page{position:absolute;inset:0;z-index:0;overflow-y:auto;overflow-x:hidden;padding-bottom:150px;scrollbar-width:none;background:radial-gradient(70% 22% at 100% 6%,rgba(255,70,110,.22),transparent),radial-gradient(70% 20% at 0% 48%,rgba(70,120,255,.2),transparent),radial-gradient(70% 20% at 100% 85%,rgba(160,80,255,.18),transparent),var(--bg);transition:transform .95s var(--bounce-soft),opacity .45s ease;will-change:transform,opacity}

.top{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;background:linear-gradient(var(--bg) 84%,color-mix(in srgb,var(--bg) 70%,transparent) 100%);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);transition:transform .18s linear}
.row{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px;letter-spacing:-.04em}

.ic{display:flex;gap:8px}.ic button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}

.page{background-attachment:local}

.dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;z-index:60;transform-style:flat}

.tabrow{position:absolute;inset:5px;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);transition:color .3s,scale .55s var(--bounce)}
.tab.on{color:var(--red)}.tab svg{width:22px;height:22px}
.sbtn{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;transition:scale .6s var(--bounce)}.sbtn:active{scale:.86}
@media(prefers-reduced-motion:reduce){:root{--bounce:cubic-bezier(.25,.9,.3,1);--bounce-soft:cubic-bezier(.25,.9,.3,1)}.skl{animation:none}}

/* ---- overlays: off-screen until the deferred sheet lands ---- */
/* #search, #pl, #sheet, #scrim and #toast are revealed only by their `.on`
   class, so keeping them hidden here cannot change the UI. It only stops them
   painting as bare flow content in the first frames, before the deferred sheet
   (which carries their positioning) has been applied. */
#search:not(.on),#pl:not(.on),#sheet:not(.on),#scrim:not(.on),#toast:not(.on){position:absolute;opacity:0;pointer-events:none}

#splash .logo{font-size:30px;gap:12px;animation:hop 1.1s infinite}

.skl:nth-child(2){animation-delay:.08s,0s}.skl:nth-child(3){animation-delay:.16s,0s}

  }catch(e){FEED.error=e.message||'offline';FEED.trending=[];return []}
}

/* ---------- last-feed cache (localStorage) ---------- */
function readFeedCache(){

    const c=JSON.parse(raw);
    if(!c||c.v!==FVER||!Array.isArray(c.items))return null;

    return items.length?{at:+c.at||0,items,chav:c.chav||{}}:null;
  }catch(e){return null}
}
function saveFeedCache(items){
  try{
    const chav={};
    (items||[]).forEach(v=>{const av=v&&v.ch&&CH[v.ch]&&CH[v.ch].av;if(av)chav[v.ch]=av});
    const at=Date.now();
    localStorage.setItem(FKEY,JSON.stringify({v:FVER,at,chav,items:(items||[]).map(v=>({id:v.id,t:v.t,c:v.c,ch:v.ch,views:v.views,pub:v.pub,cat:v.cat,dur:v.dur}))}));
    FEED.at=at;
  }catch(e){}                                   // quota or private mode: no cache, no failure
}
const iso2sec=d=>{const m=DUR_RE.exec(d||'');return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0};
/* Durations are asked for only when a list really needs them.
   Two ways an item stops counting as unknown: it already has a duration (from
   the feed cache, an earlier list or this session), or the API has already
   answered about it without one — a deleted or private video in a playlist, a
   video with no contentDetails. Those ids are remembered for the session, so
   reopening the same list (the channel sheet, a section re-render) sends
   nothing instead of asking about the same dead ids again. Only an answer
   teaches us that: a failed request marks nothing, so the next list retries. */
const DUR_NONE=new Set(),DUR_NONE_MAX=200,DUR_ST={calls:0,skipped:0,none:0};
const durUnknown=v=>!!v&&!!v.id&&v.dur==null&&!DUR_NONE.has(v.id);
function durNone(id){
  if(!id||DUR_NONE.has(id))return;
  DUR_NONE.add(id);DUR_ST.none++;
  if(DUR_NONE.size>DUR_NONE_MAX)DUR_NONE.delete(DUR_NONE.values().next().value);
}
async function loadDurations(list){
  const ids=[...new Set((list||[]).filter(durUnknown).map(v=>v.id))].slice(0,50);
  if(!ids.length)return;                        // every item is already measured
  DUR_ST.calls++;
  try{
    const j=await yt('videos',{part:'contentDetails',id:ids.join(',')});
    const got=new Set();
    (j.items||[]).forEach(it=>{
      const d=it.contentDetails&&it.contentDetails.duration;
      if(d==null)return;                        // answered, but no duration to read
      got.add(it.id);
      if(V[it.id])V[it.id].dur=iso2sec(d);
    });
    ids.forEach(id=>{if(!got.has(id))durNone(id)});   // never ask about these again
  }catch(e){}                                  // a failure teaches us nothing: keep them unknown
}
window.__ltDurations=()=>({calls:DUR_ST.calls,skipped:DUR_ST.skipped,none:DUR_ST.none,known:DUR_NONE.size});

/* Long form only. YouTube Shorts can run up to 3 minutes, so anything at or
   under that is treated as a short and never reaches the app. */
const LONG_MIN=180;
const SHORT_RE=/#shorts?\b|\/shorts\//i;
const isShort=v=>!v||SHORT_RE.test(v.t||'')||(typeof v.dur==='number'&&v.dur>0&&v.dur<=LONG_MIN);
async function dropShorts(list){
  list=(list||[]).filter(v=>v&&!SHORT_RE.test(v.t||'')&&!PRIVATE_RE.test(v.t||''));
  /* every item is measured, not just the unknown ones — but a list that already
     holds a duration for each of its items skips the call entirely (no promise,
     no request, no await tick on the render path). */
  if(list.some(durUnknown))await loadDurations(list);
  else DUR_ST.skipped++;
  return list.filter(v=>!isShort(v));
}

async function loadShelf(sh){

/* the carousel placeholders, used both for the boot skeleton and by renderExplore */
const shelfSkeleton=()=>SHELVES.map(sh=>'<div class="vh"><h2>'+esc(sh.title)+'</h2><button class="va glass" data-shelf="'+sh.id+'">View All</button></div>'+
  '<div class="car" id="car-'+sh.id+'"><div class="skl"></div><div class="skl"></div></div>').join('');
/* A shelf's load is tagged 'explore' (see loadShelf), so it can be abandoned
   when the user leaves Explore. SHELF_BUSY keeps a shelf that is already on the
   wire from being started twice when Explore is re-entered, and the abort path
   leaves the placeholder alone instead of blanking the carousel — exploreResume
   re-runs it the moment the tab is on screen again. */
const SHELF_BUSY=new Set();
function fillShelf(sh,list){
  const el=document.getElementById('car-'+sh.id);
  if(!el)return;
  el.innerHTML=list.slice(0,6).map(v=>'<div class="big" data-v="'+esc(v.id)+'"><img src="'+THUMB_BASE+esc(v.id)+'/hqdefault.jpg" alt=""><div><b>'+esc(v.t)+'</b><small>'+esc(v.c)+'</small></div><button class="play glass" data-v="'+esc(v.id)+'">'+PLAY_IC+'Play</button></div>').join('');
}
function paintShelf(sh){
  if(SHELF_BUSY.has(sh.id))return;           /* already on the wire: it fills itself */
  SHELF_BUSY.add(sh.id);
  loadShelf(sh).then(list=>{SHELF_BUSY.delete(sh.id);fillShelf(sh,list)})
    .catch(e=>{
      SHELF_BUSY.delete(sh.id);
      if(e&&e.name==='AbortError')return;    /* the page was left: exploreResume picks it up again */
      const el=document.getElementById('car-'+sh.id);if(el)el.innerHTML='';
    });
}
function renderExplore(){
  $('ex').innerHTML=shelfSkeleton();
  SHELVES.forEach(paintShelf);
}
/* entering Explore again: only the shelves that never landed are re-driven, so
   the ones already on screen are untouched */
function exploreResume(){
  SHELVES.forEach(sh=>{if(!SHELF[sh.id])paintShelf(sh)});
}

  }
};
const SEC={};

function keep(v){
  const t=(v.t||'');
  if(!t)return false;
  if(BADRE.test(t))return false;          // no reaction videos
  if(SHORTS_TAG_RE.test(t))return false;
  if(PRIVATE_RE.test(t))return false;
  return true;

async function loadSection(name){
  if(SEC[name])return SEC[name];
  const cfg=SECTIONS[name];
  try{
    const c=JSON.parse(localStorage.getItem(cfg.key)||'null');
    if(c&&c.at&&Date.now()-c.at<12*36e5&&Array.isArray(c.items)&&c.items.length){
      c.items.forEach(it=>vObj(it.id,it));
      SEC[name]=c.items.map(it=>V[it.id]).filter(Boolean);
      if(SEC[name].length)return SEC[name];
    }
  }catch(e){}

  const out=[];
  for(const chId of cfg.channels){
    if(!pageWanted('home'))throw rqAbort();      /* left the page: stop, homeResume re-runs the section */
    try{
      const c=await ensureChannel(chId);
      if(!c.up)continue;
      const j=await yt('playlistItems',{part:'snippet,contentDetails',playlistId:c.up,maxResults:12},'home');
      (j.items||[]).forEach(it=>{
        const v=it.snippet&&it.snippet.resourceId;
        if(!v||!v.videoId)return;
        out.push(vObj(v.videoId,{t:dec(it.snippet.title),c:c.title,ch:chId,
          pub:(it.contentDetails&&it.contentDetails.videoPublishedAt)||it.snippet.publishedAt,
          cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      });
    }catch(e){if(e&&e.name==='AbortError')throw e}   /* abandoned: stop the whole section */
  }
  let clean=await dropShorts(out.filter(keep));
  if(clean.length<8&&cfg.q){
    try{
      const j=await yt('search',{part:'snippet',type:'video',maxResults:20,q:cfg.q,
        videoDuration:'long',relevanceLanguage:'hi',regionCode:'IN',videoEmbeddable:'true'},'home');
      const extra=(j.items||[]).filter(it=>it.id&&it.id.videoId).map(it=>vObj(it.id.videoId,
        {t:dec(it.snippet.title),c:dec(it.snippet.channelTitle),ch:it.snippet.channelId,
         pub:it.snippet.publishedAt,cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      clean=clean.concat(await dropShorts(extra.filter(keep)));
    }catch(e){if(e&&e.name==='AbortError')throw e}
  }
  const seen=new Set();
  clean=clean.filter(v=>!seen.has(v.id)&&seen.add(v.id));
  const hi=v=>HINDI_RE.test(v.t||'')?1:0;
  clean.sort((a,b)=>hi(b)-hi(a));      // Hindi titles first, then the rest
  await loadChannels(clean.map(v=>v.ch));
  SEC[name]=clean;
  try{localStorage.setItem(cfg.key,JSON.stringify({at:Date.now(),
    items:clean.map(v=>({id:v.id,t:v.t,c:v.c,ch:v.ch,pub:v.pub,cat:v.cat}))}))}catch(e){}
  return clean;
}
async function renderSection(name){
  const cfg=SECTIONS[name];
  const box=document.getElementById(cfg.el);
  if(!box)return;
  if(box.dataset.done)return;
  box.innerHTML='<div class="skl"></div><div class="skl"></div><div class="skl"></div>';
  let list2;
  try{list2=await loadSection(name)}
  catch(e){if(e&&e.name==='AbortError')return;throw e}   /* left the page: leave it undone, retry later */
  box.dataset.done='1';

/* ---------- boot ---------- */
Object.values(S.vd||{}).forEach(o=>{if(o&&o.id)vObj(o.id,o)});
/* ---------- startup timeline ----------
   Milestones in the order they happen, ms from navigation start:
   lt:shell → lt:cache → lt:reveal → lt:paint (skeleton frame) → lt:req (first API
   call leaving) → lt:data → lt:feed → lt:feedpaint → lt:input.
   Each mark is two numbers in a fixed-size array — no DOM, no request, no storage
   while booting — and the whole run is written out once, as a single line, when
   the boot has settled. That line carries every milestone and the previous boot's
   total, so a regression is a bigger number in the log rather than something felt
   later. It stays on window.__ltTimeline for tools/startup-bench.js, and the
   WebView forwards only `lt-` lines to logcat (see MainActivity). */
const TL_CAP=16,TL=[];                      /* hard bound: marks past this are dropped */
let tlDone=false,tlTimer=0;
const mark=n=>{
  if(TL.length<TL_CAP)TL.push([n,Math.round(performance.now())]);
  try{performance.mark('lt:'+n)}catch(e){}
  tlSettle();
};
/* The timeline is written as soon as the feed has painted — that is the end of
   the boot — so the line never waits on anything. The deferred-listener mark is
   included when it landed before that (it usually does: it is attached in an idle
   slot after the skeleton frame, well before the feed comes back); when it has
   not, it is simply absent from the line. A boot that never reaches feedpaint is
   written out by the deadline below, with whatever it managed to reach. */
function tlSettle(){
  if(tlDone)return;
  for(let i=0;i<TL.length;i++)if(TL[i][0]==='feedpaint')return tlFlush();
}
const TL_KEY='lt_boot';
function tlFlush(partial){
  if(tlDone)return;tlDone=true;clearTimeout(tlTimer);
  try{
    const ms={};TL.forEach(m=>{ms[m[0]]=m[1]});
    let total=0;for(const k in ms)if(ms[k]>total)total=ms[k];   /* when the boot finished */
    let prev=0;
    try{const p=JSON.parse(localStorage.getItem(TL_KEY)||'0');prev=(p&&p.v===1&&+p.t)||0}catch(e){}
    let line='lt-startup';
    ['shell','cache','reveal','paint','req','data','feed','feedpaint','input'].forEach(n=>{
      if(n in ms)line+=' '+n+'='+ms[n];
    });
    /* warm = this boot painted the cached feed ('cache' is only marked on that
       path), err = the feed came back as an error; both are what the numbers
       above have to be read against. */
    line+=' total='+total+' prev='+prev+(prev?' vs_prev='+(total-prev>0?'+':'')+(total-prev):'')
      +' warm='+('cache' in ms?1:0)+' err='+(FEED.error?1:0)+(partial?' partial=1':'');
    window.__ltTimeline=line;
    try{localStorage.setItem(TL_KEY,JSON.stringify({v:1,t:total,at:Date.now()}))}catch(e){}
    try{console.info(line)}catch(e){}
  }catch(e){}
}
tlTimer=setTimeout(()=>tlFlush(1),12000);   /* last resort: never leave a boot unlogged */
let revealed=false;
const reveal=()=>{
  if(revealed)return;revealed=true;
  if(window.__ltRestNow)window.__ltRestNow();
  const sp=$('splash');
  if(sp&&!sp.classList.contains('out')){sp.classList.add('out');$('app').classList.add('ready')}
  mark('reveal');
};
/* Hard stop: nothing below may hold the splash up for more than 7 s. */
setTimeout(reveal,7000);

/* First-frame-ready signal: resolves once the frame that carries the shell has
   actually been painted. Two rAFs land us after that frame; the timer and the
   visibility check cover a WebView that is not rendering at all (started in the
   background, or one that never fires rAF). Cached, so anything that needs the
   signal later gets the same promise. */
let frameReady=null;
function firstFrame(){
  if(frameReady)return frameReady;
  return frameReady=new Promise(res=>{
    let done=false;
    const fin=()=>{if(done)return;done=true;mark('paint');res()};
    if(document.visibilityState==='hidden')return fin();
    requestAnimationFrame(()=>requestAnimationFrame(fin));
    setTimeout(fin,400);
  });
}
window.__ltFirstFrame=firstFrame;
/* Skeleton shell: the loading state the app already ships — the static #feed
   skeletons, the chip row, the carousel placeholders — painted before the feed
   request comes back, so the first frame is the shell and the splash never sits
   on the network. It starts no request of its own. */
const SK3='<div class="skl"></div><div class="skl"></div><div class="skl"></div>';
function paintSkeleton(){
  if(feed().length){                           /* last feed known: real cards, no request */
    renderChips();
    list(feed(),$('feed'));
    mark('cache');
  }else{
    $('chips').innerHTML=CHIPS_BASE.map(c=>'<button class="chip glass'+(c===cat?' on':'')+'">'+c+'</button>').join('');
    $('feed').innerHTML=LDR+SK3;
  }
  $('ex').innerHTML=shelfSkeleton();
  $('subfeed').innerHTML=SK3;
}
function paintShell(){
  renderChips();
  list(feed(),$('feed'));
  if(!feed().length&&FEED.error)$('feed').innerHTML='<div class="empty">Could not load videos.<br>'+esc(FEED.error)+'</div>';
  renderExplore();
  renderSubs();
}
/* Boot, in two stages. Stage 1 needs no network: the shell and its skeletons are
   painted and the splash leaves on the first frame the app can actually produce,
   however long the feed takes. Stage 2 lands the data and swaps the skeletons for
   cards in place. Nothing waits on a timer. */
/* The last feed, if there is one, is on screen before the first frame: this is
   the only stage-1 work that reads storage, and it costs one JSON.parse. */
{const fc=readFeedCache();
 if(fc){Object.assign(CAV,fc.chav);fc.items.forEach(o=>vObj(o.id,o));FEED.cached=fc.items;FEED.at=fc.at}}
paintSkeleton();
mark('shell');
reveal();
firstFrame();                                    /* lt:paint = the skeleton frame */
loadTrending().catch(e=>{if(!FEED.error)FEED.error=(e&&e.message)||'offline'})
  .then(()=>{
    mark('data');
    if(window.__ltRestNow)window.__ltRestNow();   /* deferred sheet before the cards paint */
    try{paintShell()}catch(e){}
    reveal();
    mark('feed');
    requestAnimationFrame(()=>requestAnimationFrame(()=>mark('feedpaint')));
    return firstFrame();
  });

/* ---------- 3D depth: cards tilt under the finger ---------- */
const DEPTH=()=>S.opt.depth!==0;
const K=()=>Math.max(0,Math.min(100,+S.opt.pdepth||0))/100;   // 0 = flat, 1 = full depth
function applyDepth(){document.documentElement.dataset.depth=DEPTH()?'on':'off'}
applyDepth();

let tiltEl=null;
function tiltStart(e){
  if(!DEPTH())return;
  const card=e.target.closest('.card');
  if(!card||e.pointerType==='mouse')return;
  tiltEl=card;card.classList.add('tilt');
}
function tiltMove(e){
  if(!tiltEl||!DEPTH())return;
  if(!tiltEl.classList.contains('tilt'))tiltEl.classList.add('tilt');
  const r=tiltEl.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width-.5;      // -0.5 .. 0.5
  const py=(e.clientY-r.top)/r.height-.5;
  const k=K();
  const rx=(-py*9*k).toFixed(2), ry=(px*11*k).toFixed(2);
  tiltEl.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) translateZ(${(10*k).toFixed(1)}px) scale(${(1+0.015*k).toFixed(3)})`;
}
function tiltEnd(){
  if(!tiltEl)return;
  const c=tiltEl;tiltEl=null;
  c.style.transform='';
  setTimeout(()=>c.classList.remove('tilt'),260);
}
/* ---------- parallax: layers drift at different speeds (scroll + phone tilt) ---------- */
const PARALLAX=()=>S.opt.parallax!==0;
let gyroX=0,gyroY=0;
function applyParallax(){
  const on=PARALLAX();
  document.documentElement.dataset.parallax=on?'on':'off';
  if(!on){
    document.querySelectorAll('.page').forEach(p=>p.style.backgroundPositionY='');
    document.querySelectorAll('.thumb img').forEach(i=>i.style.transform='');
  }
}
applyParallax();
/* Named, not anonymous: the sensor subscription is one of the listeners that is
   attached after the first frame (see bindInput), so it must be referable. */
function onOrient(e){
  if(!PARALLAX())return;
  gyroX=Math.max(-1,Math.min(1,(e.gamma||0)/35));
  gyroY=Math.max(-1,Math.min(1,((e.beta||0)-45)/40));
  parallaxKick();
}

/* Read pass, then write pass. This used to interleave the two: the page's own
   writes (background offset, header, dock and chip drift) dirtied the style tree
   before the first rect was measured, so that first thumbnail read paid for a
   full recalc, and every card after it forced the next one. Nothing written here
   changes layout — transform and background-position only — so measuring the
   whole frame first and writing afterwards yields exactly the same values, with
   one layout flush per frame instead of one per element. */
const relBuf=[];
function parallaxScroll(){
  if(!PARALLAX())return;
  const k=K();
  const vh=innerHeight;
  const pg=document.querySelector('.page:not([inert])');
  const top=document.querySelector('.page:not([inert]) .top');
  const dock=document.querySelector('.dock');
  const chips=document.querySelector('.page:not([inert]) .chips');
  const imgs=document.querySelectorAll('.page .thumb img');

  /* ---- read pass ---- */
  const st=pg?pg.scrollTop:0;
  relBuf.length=0;
  for(let i=0;i<imgs.length;i++){
    const r=imgs[i].parentElement.getBoundingClientRect();
    relBuf.push(r.bottom<-80||r.top>vh+80?null:(r.top+r.height/2-vh/2)/(vh/2));   // -1 .. 1, null = off screen
  }

  /* ---- write pass ---- */
  if(pg)pg.style.backgroundPositionY=(-st*0.22*k).toFixed(1)+'px';

  /* the whole shell drifts: header, dock and chip row all move a little */
  if(top&&pg)top.style.transform=`translate3d(${(gyroX*3*k).toFixed(2)}px,${(-Math.min(st,120)*0.06*k).toFixed(2)}px,0)`;
  if(dock)dock.style.transform=`translate3d(${(gyroX*5*k).toFixed(2)}px,${(gyroY*2.5*k).toFixed(2)}px,0)`;
  if(chips)chips.style.transform=`translate3d(${(gyroX*-2.5*k).toFixed(2)}px,0,0)`;
  const x=gyroX*2.5*k;
  for(let i=0;i<imgs.length;i++){
    const rel=relBuf[i];
    if(rel===null)continue;
    const y=(-rel*7*k)+gyroY*2.5*k;
    imgs[i].style.transform=`translate3d(${x.toFixed(2)}%,${y.toFixed(2)}%,0) scale(1.14)`;
  }
}

/* cards recede slightly as they move away from the centre of the screen.
   Same split as the parallax pass, and it matters more here: this is the loop the
   first depth frame after boot and every scroll frame runs, over every card on
   every page. All the rects are measured before the first transform is written,
   so the frame lays out once instead of once per card. The buffer keeps the two
   reasons to skip a card apart — off screen (transform cleared, as before) and
   under the finger (left exactly as the tilt wrote it). */
let depthRaf=0;
const rectBuf=[],SKIP_CARD=-1;
function depthScroll(){
  if(!DEPTH())return;
  const vh=innerHeight;
  const k=K();
  const cards=document.querySelectorAll('.page .card');

  /* ---- read pass ---- */
  rectBuf.length=0;
  for(let i=0;i<cards.length;i++){
    const c=cards[i];
    if(c.classList.contains('tilt')){rectBuf.push(SKIP_CARD);continue}
    const r=c.getBoundingClientRect();
    rectBuf.push(r.bottom<-80||r.top>vh+80?null:[r.top,r.height]);
  }

  /* ---- write pass ---- */
  for(let i=0;i<cards.length;i++){
    const m=rectBuf[i],c=cards[i];
    if(m===SKIP_CARD)continue;
    if(m===null){c.style.transform='';continue}
    const d=Math.min(1,Math.abs((m[0]+m[1]/2)-vh/2)/(vh*0.62));
    c.style.transform=`translateZ(${(-d*30*k).toFixed(1)}px) scale(${(1-d*0.05*k).toFixed(3)})`;
    c.style.opacity=(1-d*0.18*k).toFixed(3);
  }
}
let parallaxRaf=0;
function parallaxKick(){if(!PARALLAX())return;cancelAnimationFrame(parallaxRaf);parallaxRaf=requestAnimationFrame(parallaxScroll)}
function depthKick(){parallaxKick();if(!DEPTH())return;cancelAnimationFrame(depthRaf);depthRaf=requestAnimationFrame(depthScroll)}
/* Non-critical input listeners — the gyro subscription, the scroll/resize that
   drive the parallax and depth passes, and the four document-level pointer
   listeners behind the card tilt — are attached only once the shell's first
   frame has actually been painted, in the next idle slot. None of them can
   affect anything the user sees before that frame: at that point nothing has
   been scrolled, nothing has been tilted and no orientation sample has arrived.
   Attaching them at parse time instead meant the sensor pipeline could start,
   and a document-level scroll handler could run its full parallax/depth pass,
   while the splash was still up. Everything else (clicks, image load/error,
   the player's message bridge, the layout resize) stays bound from the start,
   because those are needed on the very first interaction or the first paint. */
let inputBound=false;
function bindInput(){
  if(inputBound)return;inputBound=true;
  addEventListener('deviceorientation',onOrient,{passive:true});
  document.addEventListener('scroll',depthKick,{capture:true,passive:true});
  addEventListener('resize',depthKick);
  document.addEventListener('pointerdown',tiltStart,{passive:true});
  document.addEventListener('pointermove',tiltMove,{passive:true});
  document.addEventListener('pointerup',tiltEnd,{passive:true});
  document.addEventListener('pointercancel',tiltEnd,{passive:true});
  /* If the page had already been scrolled in the window before these landed,
     sync the depth/parallax state once. Guarded on a non-zero offset so the
     at-rest frame is exactly what it was: with nothing scrolled, no scroll
     event would have fired before either, so no pass may run. */
  const pg=document.querySelector('.page:not([inert])');
  if(pg&&pg.scrollTop>0)depthKick();
  mark('input');
}
function scheduleInput(){
  if(window.requestIdleCallback)requestIdleCallback(bindInput,{timeout:600});
  else setTimeout(bindInput,0);
}
if(window.__ltFirstFrame)window.__ltFirstFrame().then(scheduleInput);
else scheduleInput();

/* ---------- toast ---------- */
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- dock: glass lens + sliding pages (from the reference) ---------- */
const P=['home','explore','subs'].map(n=>$('p-'+n)),T=['home','explore','subs'],L=['Home','Explore','Subscriptions'],N=T.length;
$('tabrow').innerHTML=T.map((t,i)=>`<button class="tab" tabindex="0" data-i="${i}">${ic(t)}${L[i]}</button>`).join('');
const tabs=$('tabs'),tabEls=[...tabs.querySelectorAll('.tab')];
/* Restart the lens' jelly and the page's staggered rise animations. A restart
   only takes effect once the "animation:none" state has been committed, so one
   style flush is unavoidable — but one flush for the whole batch replaces the
   nine the old per-element loop forced (one for the lens, then one per element).
   Read pass first, then the write pass. */
function replay(p){
  const els=[...p.querySelectorAll('.chip,.vh,.card,.big,#sg>button')].slice(0,8);
  const l=$('lens');
  l.classList.remove('jelly');
  for(let i=0;i<els.length;i++)els[i].style.animation='none';
  void p.offsetWidth;                                     /* the single forced layout */
  l.classList.add('jelly');
  for(let i=0;i<els.length;i++){const e=els[i];e.style.animation='';e.style.animationDelay=(i*55)+'ms'}
}
let pos=0,press=false,moved=false,sx=0,lastIdx=0;
const clamp=v=>Math.max(0,Math.min(N-1,v));
function render(anim){
  /* Read pass: the only thing the writes below need from layout is which tab is
     current, so nothing here measures the DOM. The lens position used to read
     `tabs.clientWidth` on every frame — a forced layout per drag frame, and one
     on the boot path before the shell had ever been laid out. Its own width is
     calc((100% - 10px)/3) of the strip, so a percentage translate lands on the
     exact same pixel as `pos * (tabs.clientWidth - 10) / 3` without measuring. */
  const idx=Math.round(pos);
  const change=idx!==lastIdx;
  const was=lastIdx;
  lastIdx=idx;
  /* Write pass */
  $('app').classList.toggle('drag',!anim);
  P.forEach((p,i)=>{const d=i-pos,a=Math.min(1,Math.abs(d));p.style.transform=`translateX(${d*100}%) scale(${1-a*.05})`;p.style.opacity=1-a*.4;p.inert=Math.abs(d)>.45;p.style.pointerEvents=Math.abs(d)>.45?'none':''});
  $('lens').style.transform=`translateX(${pos*100}%) scale(${press?1.18:1})`;
  tabEls.forEach((t,i)=>t.classList.toggle('on',i===idx));

else setTimeout(apply,60);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',idle,{once:true});
else idle();setTimeout(apply,3000);})();
