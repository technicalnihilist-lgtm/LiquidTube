<!-- Warm the two origins the first screen needs, before the 61 KB of markup and
     style below is parsed: the API host (fetched with CORS, so a CORS socket)
     and the thumbnail host (plain <img> requests, so a plain socket). On a cold
     start that is one DNS lookup plus TCP and TLS per origin, and the feed fetch
     and the first thumbnails would otherwise each pay it on their own critical
     path. dns-prefetch first for engines that skip preconnect, preconnect for
     the handshake itself. Neither sends a request, so nothing here can change
     what the app fetches, and both hosts are already on the WebView allowlist. -->
<link rel="dns-prefetch" href="https://www.googleapis.com">
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>

<style>

   distance itself — roughly 1250 px on a slow link and 3000 px on a fast one —

   user is looking at the first two screens; and it re-examines every image it
   still holds on every scroll it drives. Here the distance is the app's own

   already have their picture), and an image that has been asked for is

   is reserved by the stylesheet and a picture that arrives late shifts nothing
   (that is 6.8's subject, and this item must not spoil it). An `<img>` with no
   `src` draws nothing, which is exactly what an image that is still fetching
   draws, so the empty frame before the picture lands is the frame the user saw
   before. The hooks the rest of the app reads are untouched: `data-id` and

   maxres→hqdefault fallback) and `onerror`→`TH` (the twice-failed card).

   the channel sheet and a full-width feed card all fetched the same picture — and
   the small ones paid ten times the bytes they could ever draw. i.ytimg.com
   serves the same frame at several sizes, so the app now asks for the smallest
   one that still covers the pixels the card actually paints.

   The ladder is the CDN's, and every rung is a real file:

   moment the box has a size: the image is in the document, laid out, and about to
   be asked for. `img.clientWidth` is the `.thumb` width (the image is
   `position:absolute; inset:0; width:100%`), and the reads all happen before any
   write in the same callback, so the batch costs one style/layout flush at most.

   - the box in CSS px;

     not already give, and an uncapped ratio would push every card to maxres on
     exactly the phones that can least afford the bytes;

   the app does with a card or a shelf is delegated from `document` or from one of

   and async, which a save path cannot be), no library, no request.

   that every earlier build wrote — so old data still loads unchanged and
   nothing has to be migrated. Codes are emitted as single UTF-16 units mapped
   out of the surrogate range (code >= 0xD800 is written +0x800), so a blob is

/* Every API call goes through one request cache. The key is the path plus the
   sorted parameters with `key` left out, so two calls that would send the same

   channel's metadata and a video's duration are good for hours, an upload list
   for half an hour, the trending chart and a search for ten minutes. A repeat
   inside that window is answered from memory — no round trip, no quota unit —
   which is what the search box (a call per keystroke), a shelf's "View All"
   (the same search again), a reopened channel sheet and a chip tapped twice
   all hit. Only a successful response is stored: a throw, a 500 or a quota
   refusal leaves no entry, so the next call retries instead of serving the
   failure. The map is capped at RQ_MAX entries and evicts the oldest first, so
   it cannot grow with the number of distinct queries typed in a session. The
   stored object is handed straight to the caller, which only reads it: every
   call site maps or filters `items` into objects of its own.

   A call that is still on the wire is shared, not repeated. `RQI` holds the
   promise of every request that has been sent but has not answered yet, under
   the same key, so a second call for the same query before the first returns
   joins it instead of spending another round trip and another quota unit. The
   slot is cleared the moment the response lands (or the request fails), and a
   success has already been put in `RQ` by then, so the next call is an ordinary
   cache hit and a failure leaves nothing behind to block a retry. Two callers
   share one parsed response object, which is exactly what a cache hit already
   hands out — every call site only reads it. This is what makes a double tap
   free: a chip tapped twice while its section is loading, "View All" pressed
   again before the shelf's search comes back, the same query retyped inside one
   round trip, a channel sheet reopened while the first is still fetching.

   A request that fails for a transient reason is tried once more, after an
   exponential backoff, before the failure is handed to the caller. Transient
   means a 5xx, a 429, or a fetch that never got a response at all (offline, DNS,
   a reset connection, TLS). A 4xx is an answer, not a glitch — a revoked key, a
   quota refusal, a not-found — so it is never repeated. The retry lives inside
   the in-flight promise, so callers that joined a request also wait for its
   retry and still share one result, and only a success is written to the cache.

   response itself says otherwise. A caching header on the response —

   with the tab whose DOM its answer is rendered into, and every tab change

   to the tab the user is on: a request whose owning page is not in that set, and
   that no page in it is waiting for either, is aborted through an AbortController

   quota is spent on a list nobody is looking at any more. A tagged call for a
   page outside the set is not even sent, so a half-finished chain (a shelf that
   was waiting on a shared channel lookup) stops at its next step instead of
   firing one more request for a tab nobody is on. Every owner of such a request
   already tolerates a failure (a shelf's promise is caught in paintShelf, a
   section's in chip) and every page re-drives whatever it never got when it is
   entered again (exploreResume, homeResume), so what the user finally sees is
   unchanged. Never abandoned: a request nobody tagged (the feed, the channel
   queue, durations, the search box, the player — shared or needed everywhere), a
   request an untagged caller has joined (it is no longer one page's private

   them, so a hundred searches is the whole day gone and everything else comes
   back refused until the quota resets. That ceiling is the API's, not the
   app's, and the app cannot lift it — but it can say where it stands, which is

   over how many requests, and how many refusals it took.

   Nothing here is on screen. The meter is read through window.__ltQuota(), one
   object with the same shape every time, and written out as a single `lt-quota`

   layout is touched, so the UI is exactly what it was before.

   mean completely different things arrived looking the same — a revoked key, a
   daily quota that is spent, a device with no network, a video that no longer
   exists — and any handler that wanted to know which one it had was left sniffing
   the message text. The search panel did exactly that (`QUOTA_RE.test(e.message)`)

     unknown    anything else, which should not happen and is worth seeing

const shStr=s=>typeof s==='string'&&s!=='';

    if(Object.keys(SH_ST.ep).length>=8)return;
    SH_ST.ep[k]=0;

  SH_ST.ep[k]++;
  if(SH_ST.lines>=SH_LINES)return;            /* bounded: the count keeps counting */
  SH_ST.lines++;

function shErr(ep,why){

  SH_ST.items+=j.items.length;
  return j.items;
}

  const out=[];
  for(let i=0;i<arr.length;i++){const it=arr[i];if(ok(it))out.push(it);else SH_ST.dropped++}
  if(arr.length&&!out.length)throw shErr(ep,'entry');   /* a non-empty answer with nothing usable */
  SH_ST.kept+=out.length;

const shTitle=it=>shObj(it.snippet)&&typeof it.snippet.title==='string';
const shVid=it=>shObj(it)&&shStr(it.id)&&shTitle(it);                        /* videos: id is the string */
const shRes=it=>shObj(it)&&shTitle(it)&&shObj(it.snippet.resourceId)
  &&shStr(it.snippet.resourceId.videoId);                                    /* playlistItems */
const shSea=it=>shObj(it)&&shTitle(it)&&shObj(it.id)&&shStr(it.id.videoId);   /* search: id.videoId */
const shDur=it=>shObj(it)&&shStr(it.id);                                     /* videos?part=contentDetails */

  const ok=SH_SPEC[ep];

  const items=shList(j,ep),kept=shKeep(items,ok,ep);

/* ---------- async safety net (item 5.1) ----------
   Every path in this app that waits — a request, a channel lookup, a section, a
   shelf, the boot's second stage, the work bindInput does in an idle slot —
   ended in one of two places: a rejection handler written for it by hand, or
   nowhere at all. The first is only as good as its own body: a handler that
   throws (a node the render expects is gone, a shape the API did not send) threw
   into nowhere just the same. The second was a bare `.then` whose promise nobody
   holds. Either way the app saw an unhandled rejection — a console error, and a
   step of the boot or of a tap that silently never happened.

   Three functions close that, and nothing else in the app changed shape:

     asGuard(where,fn,fallback)  run fn now; keep what it returns (a value or a
                                 promise) and turn a throw or a rejection into
                                 `fallback`.
     asWatch(where,promise,fallback)  the same for a promise already on the wire.
     asSafe(where,err)           record a failure a caller has already answered
                                 for itself (it has its own empty state) so the
                                 log still shows it.

   A failure writes one line under the `lt-` prefix MainActivity forwards:

     lt-async where=play.channel err=<message> n=<failures so far>

   `where` is the site, not the data: a search carries what the user typed and
   the log goes to logcat, so no argument, no id and no URL is ever in the line.
   AbortError is not a failure — a page the user left is abandoned on purpose —
   so it is neither counted nor logged, and a guarded call simply returns its
   fallback. Both tables are bounded (AS_LINES lines, AS_MAXW sites) so a long
   broken session cannot flood logcat; past that the counters keep counting and
   `dropped` records what was not printed.

   The cost when nothing fails is one Promise.resolve per guarded path and one
   comparison: no timer, no listener, no allocation. window.__ltAsync() returns
   the whole picture, which is what tools/async-guard-check.js reads and what
   items 5.4 and 18.x will build on. */
const AS_LINES=20,AS_MAXW=12;
const AS_ST={guards:0,caught:0,lines:0,dropped:0,by:{}};
function asSafe(where,e){
  if(e&&e.name==='AbortError')return;          /* abandoned on purpose: not a failure */
  AS_ST.caught++;
  if(!(where in AS_ST.by)&&Object.keys(AS_ST.by).length<AS_MAXW)AS_ST.by[where]=0;
  if(where in AS_ST.by)AS_ST.by[where]++;
  if(AS_ST.lines>=AS_LINES){AS_ST.dropped++;return}   /* bounded: the count keeps counting */
  AS_ST.lines++;
  try{console.log('lt-async where='+where+' err='+String((e&&e.message)||e||'unknown').slice(0,120)
    +' n='+AS_ST.caught)}catch(x){}
}
function asGuard(where,fn,fallback){
  AS_ST.guards++;
  let p;
  try{p=fn()}catch(e){asSafe(where,e);return Promise.resolve(fallback)}
  return Promise.resolve(p).catch(e=>{asSafe(where,e);return fallback});
}
function asWatch(where,p,fallback){
  AS_ST.guards++;
  return Promise.resolve(p).catch(e=>{asSafe(where,e);return fallback});
}
window.__ltAsync=()=>{
  const by={};
  Object.keys(AS_ST.by).forEach(k=>{by[k]=AS_ST.by[k]});
  return {guards:AS_ST.guards,caught:AS_ST.caught,lines:AS_ST.lines,dropped:AS_ST.dropped,sites:by};
};
/* ---------- the last net: uncaught errors and unhandled rejections (item 5.4) ----------
   Items 5.1 to 5.3 answered for every failure the app knows it made: a request
   that rejects, a handler that throws on the way back, a sentence the server
   wrote. What was still uncovered is the failure nobody was waiting for. A tap
   handler that throws, a frame callback that throws, a promise nobody chained a
   catch onto — the engine reports those to the window, and until now the app
   listened to none of it: the tap simply did nothing, the console said
   "Uncaught", and no code in the app ever learned that it had happened. On a
   phone that is the worst kind of bug, because it is invisible and it is not
   rare: the DOM a long session leaves behind is not always the DOM the code was
   written against.

   Two listeners close it, and they do the two things the item asks for:

     lt-global kind=error where=index.html:213 msg=... n=1
     lt-global kind=reject where=index.html:1418 msg=... n=2

   `where` is the file's last path segment and the line — never a URL, never a
   query — and `msg` is the message flattened to one line and cut at GL_MSG
   characters, because a stack trace is not something logcat can use and a search
   carries what the user typed. The line goes out under the same `lt-` prefix
   MainActivity forwards, so an uncaught error reaches logcat beside the ones the
   app already writes, in the same shape.

   Recovery is deliberately small, and each step is something the user would
   otherwise be stuck with. The splash comes down: if the throw lands while the
   shell is still behind it, the app takes it down itself — through reveal() once
   that exists, so the 7 s hard stop is cleared and the timeline is marked, and
   through the same two class swaps reveal() makes when the throw came earlier
   than that. Nothing appears that was not going to appear: it is the shell the
   app had already painted, one error earlier than it expected, and only when
   #feed has content — otherwise there is nothing to reveal and the hard stop
   keeps owning it. A card caught mid-tilt is released, so it does not sit at an
   angle holding a layer until the finger comes back. Everything else that can
   recover registers itself through glHooks (see tiltEnd), which is how the net
   never calls into code that has not been defined yet.

   What the net deliberately does NOT do is redraw, refetch or re-render. An
   uncaught error says something threw; it does not say what state the page is
   in, and guessing at a repaint is how a cosmetic bug becomes a lost feed.
   Retrying the feed is 5.7's job, the retry affordance is 5.8's, and both know
   which failure they are answering.

   Three bounds keep the net from becoming a problem of its own. An error thrown
   inside a frame callback repeats sixty times a second, so a site is printed
   **once** and only counted after that (`n` in the table keeps rising, logcat
   does not); at most GL_MAXS sites and GL_LINES lines are remembered, past which
   `dropped` counts what was not printed; and the handler is re-entrancy guarded,
   so an error inside the handler cannot call itself. An AbortError is not a
   failure here either — a page the user left is abandoned on purpose, exactly as
   asSafe() decided in 5.1 — and a resource that failed to load (an <img> with no
   onerror) is not an uncaught error: it has its own path, and it does not move
   these counters.

   A rejection the net has counted is also prevented: it has been logged once, in
   the app's own format, so the WebView's uncontrolled duplicate of the same
   event is noise rather than information.

   The cost when nothing fails is two listeners and nothing else — no timer, no
   allocation, no work per frame. window.__ltGlobal() returns the whole picture,
   which is what tools/global-error-check.js reads and what 5.10's self-check
   will build on. */
const GL_LINES=20,GL_MAXS=8,GL_MSG=120;
const GL_ST={n:0,err:0,rej:0,lines:0,dropped:0,rescued:0,by:{},last:null};
/* Recovery steps live here, added by the code that can actually perform one —
   so the net never calls into something that has not been defined yet. */
const glHooks=[];

function glMsg(v){

   class swaps reveal() makes when the throw came earlier than that. (2) Whatever
   the hooks below answer for; today that is a card caught mid-tilt, which would

  if(GL_ST.lines>=GL_LINES){GL_ST.dropped++;return}     /* bounded: the count keeps counting */

/* ---------- slow requests (item 2.10) ----------
   A request that takes longer than RQ_SLOW_MS is worth a line in the log, because
   a slow round trip is the one failure the user feels but nothing in the app
   could name: a feed that hangs, a channel sheet that never opens, a search that
   sits there. Every attempt is timed in rqFetch, around the await of rqOnce — so
   the number covers the round trip and the body read, and excludes the backoff
   sleep between attempts — and an attempt over the threshold writes one line:

     lt-slow ep=videos.chart ms=1234 attempt=0 status=200 n=1

   `ep` is the endpoint, told apart where one path serves two very different
   calls (videos.chart is the feed, videos.dur a duration lookup). The request's
   parameters are deliberately NOT in the line: a search carries what the user
   typed, and the log goes to logcat — the endpoint is what the item asks for and
   what a regression shows up in. A failure is logged with the status it got and
   `err=net` when it never got one at all, `err=abort` when the page that owned
   it was left (item 2.7), so a cancelled request is not mistaken for a slow one
   that answered.

   Nothing here is on screen and nothing here is stored. The line goes to
   console.log under the `lt-` prefix MainActivity already forwards to logcat,
   the counters live in memory for the session, and both are bounded: at most
   RQ_SLOW_LINES lines (a long offline session cannot flood logcat — past that
   the counter keeps counting and `dropped` records what was not printed) and at
   most RQ_SLOW_EP_MAX endpoints in the per-endpoint table. window.__ltSlow()
   returns the whole picture, worst offender included, which is what
   tools/slow-request-check.js reads and what item 18.2 and 18.9 will build on.

   listener, no allocation unless the threshold was actually crossed. */
const RQ_SLOW_MS=800,RQ_SLOW_LINES=40,RQ_SLOW_EP_MAX=12;

function rqEp(path,params){                       /* the endpoint, with the two `videos` calls told apart */
  if(path==='videos')return (params&&params.chart)?'videos.chart':'videos.dur';
  return String(path||'?');

/* ---------- what the response says about its own freshness ---------- */
/* The server is the authority on how long its answer stays good, so a caching
   header on a response is honoured ahead of the endpoint table in rqTtl().
   Read: Cache-Control (max-age, s-maxage, no-cache, no-store), Pragma: no-cache
   when there is no Cache-Control, and Expires with Date for servers that only
   send the old pair; Age is subtracted because it is time the response already
   spent in a cache, and Date is subtracted too when it is older than the
   request, because that is time it already spent on the wire. Two limits keep
   this from doing damage. A header may only SHORTEN the endpoint's window,
   never extend it, so a server (or a CDN in front of it) that says
   max-age=86400 cannot make a search result or the trending chart a day stale.
   And a header that says do not keep it — no-store, no-cache, max-age=0, an
   Expires in the past — is taken at its word and nothing is stored, so the next
   call goes out; the callers that joined the request still get the response.
   Nothing said means rqTtl() decides, which is what happens today: the live
   endpoint sends no Cache-Control, no Expires, no Age and no ETag at all, and
   its CORS response exposes only vary, content-encoding, date, server and
   content-length, so this reader finds nothing and every call keeps exactly the
   window item 2.1 gave it. It is a fallback for the day the server, a proxy or
   a CDN starts saying something. `h` is the response's Headers, or undefined in
   a harness that does not provide one. */

  const n=parseInt(v,10);

function rqStamp(h,k){                                            /* a header's HTTP date, or -1 */
  const t=Date.parse(rqHdr(h,k));
  return isFinite(t)?t:-1;

  if(!h)return null;                                              /* no headers at all: the table decides */
  const cc=rqHdr(h,'cache-control').toLowerCase(),d={};
  if(cc)cc.split(',').forEach(p=>{                                /* `k=v`, `k`; quoted values unquoted */
    const i=p.indexOf('='),k=(i<0?p:p.slice(0,i)).trim();
    if(k)d[k]=i<0?'':p.slice(i+1).trim().replace(/^"(.*)"$/,'$1');

  if(!cc&&rqHdr(h,'pragma').toLowerCase()==='no-cache'){max=0;src='pragma'}
  if('no-cache' in d){max=0;src='no-cache'}                        /* wins over any max-age beside it */

   caller reads for freshness. */
async function rqOnce(path,q,sig){
  qSpend(path,Date.now());   /* the request is leaving: this attempt is what costs a unit (item 2.9) */

    try{

   under that is treated as a short and never reaches the app. */
const LONG_MIN=180;
const SHORT_RE=/#shorts?\b|\/shorts\//i;
const isShort=v=>!v||SHORT_RE.test(v.t||'')||(typeof v.dur==='number'&&v.dur>0&&v.dur<=LONG_MIN);
async function dropShorts(list){
  list=(list||[]).filter(v=>v&&!SHORT_RE.test(v.t||'')&&!PRIVATE_RE.test(v.t||''));
  /* every item is measured, not just the unknown ones — but a list that already
     holds a duration for each of its items skips the call entirely (no promise,
     no request, no await tick on the render path). */
  if(list.some(durUnknown))await loadDurations(list);

function keep(v){

async function loadSection(name){
  if(SEC[name])return SEC[name];

  const out=[];
  for(const chId of cfg.channels){
    if(!pageWanted('home'))throw rqAbort();      /* left the page: stop, homeResume re-runs the section */
    try{
      const c=await ensureChannel(chId);
      if(!c.up)continue;
      const j=await yt('playlistItems',{part:'snippet,contentDetails',playlistId:c.up,maxResults:12},'home');
      (j.items||[]).forEach(it=>{
        out.push(vObj(it.snippet.resourceId.videoId,{t:dec(it.snippet.title),c:c.title,ch:chId,
          pub:(it.contentDetails&&it.contentDetails.videoPublishedAt)||it.snippet.publishedAt,
          cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      });

  }

  if(clean.length<8&&cfg.q){
    try{

        videoDuration:'long',relevanceLanguage:'hi',regionCode:'IN',videoEmbeddable:'true'},'home');

         pub:it.snippet.publishedAt,cat:name==='anime'?'Anime':name==='cartoon'?'Cartoon':'Animation'}));
      clean=clean.concat(await dropShorts(extra.filter(keep)));
    }catch(e){if(e&&e.name==='AbortError')throw e}

async function renderSection(name){
  const cfg=SECTIONS[name];

    if(e&&e.name==='AbortError')return;   /* left the page: leave it undone, retry later */
    /* A section that failed to load is not an error the user should ever see
       twice: the box gets the same sentence the empty branch below writes, and
       `dataset.done` is deliberately not set, so the next visit re-runs the
       section instead of showing a dead box for the rest of the session. This

       rejection went nowhere and the skeletons stayed on screen for good. */
    asSafe('section.render.'+name,e);

/* ---------- player ---------- */
let cur=null;
/* Taking a frame down is two steps, not one. Emptying `.art` detaches the embed,
   and a detached frame is not a stopped one: the <video> inside it keeps its
   decoder, its audio route and its playing state until the renderer collects
   the frame, which on a WebView can be well after the panel has slid away —
   long enough to hear a video that is no longer on screen. So the frame is
   navigated off the embed first (`about:blank`), which unloads the player
   document and drops its media element, and only then is the box emptied. One
   helper because there are two ways a frame goes: `mount()` replaces it on the
   next play or on a loop wrap, `closeAll()` closes the player (item 4.4). */
function dropFrame(){
  const a=qs('.art','pl');
  const f=a&&qs('iframe',a);
  if(f){try{f.src='about:blank'}catch(e){}}
  if(a)a.innerHTML='';
  return a;
}
/* The player's two listeners belong to the player and are taken off with it:
   `ltOff('pl')` runs at the top of every mount (so a play, a replay or a loop
   wrap leaves the previous iframe's handler behind with the iframe) and in
   `closeAll` (so a closed player holds nothing). The bridge is registered with
   the player rather than at parse time, which is also one fewer listener on the
   document for the whole session for a user who never opens a video. */
function mount(id,title){
  ltOff('pl');
  const a=dropFrame();
  if(!a)return;
  a.innerHTML=LDRABS+'<iframe src="'+EMBED_BASE+esc(id)+'?autoplay=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&enablejsapi=1'+(S.opt.cc?'&cc_load_policy=1':'')+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="'+esc(title||'')+'"></iframe>';
  const f=qs('iframe',a);
  if(!f)return;                            /* nothing to wire: the panel keeps its loader */
  ltOn('pl',f,'load',()=>{try{f.contentWindow.postMessage(JSON.stringify({event:'listening'}),'*')}catch(e){}});
  ltOn('pl',window,'message',onYtMsg);
}
function play(id){
  const v=V[id];if(!v)return;
  if(isShort(v)){toast('Shorts are turned off');return}
  cur=v;
  $('sheet').classList.remove('on');
  S.hist=S.hist.filter(x=>x!==id);S.hist.unshift(id);capHead(S.hist);
  S.vd[id]={id,t:v.t,c:v.c,ch:v.ch,pub:v.pub,views:v.views};
  {const keep=new Set([...S.hist,...S.liked,...S.later]);Object.keys(S.vd).forEach(x=>{if(!keep.has(x))delete S.vd[x]})}
  save();
  mount(id,v.t);
  $('ptitle').textContent=v.t;
  $('pmeta').textContent=v.c+(v.views?' · '+num(v.views)+' views':'')+(v.pub?' · '+ago(v.pub):'');
  $('ppp').textContent=S.liked.includes(id)?'Liked':'Like';
  $('plk').textContent='Channel';
  $('pl').classList.add('on');$('scrim').classList.add('on');slideHint();
  /* The meta line is redrawn once the channel is known — it adds nothing to the
     screen that is not already there, only the avatar-backed title. This was the
     last `.then` in the app with no rejection handler at all: an element missing
     from the DOM made the handler throw into nowhere, and the video still played
     with a line that was never updated and no trace of why. Guarded, with the
     line it already shows as the fallback, so a failure costs the redraw and
     nothing else (item 5.1). */
  if(v.ch)asWatch('play.channel',loadChannels([v.ch]).then(()=>{
    if(cur&&cur.id===id)$('pmeta').textContent=v.c+(v.views?' · '+num(v.views)+' views':'')+(v.pub?' · '+ago(v.pub):'');
  }));
}

/* The channel id is read before the close: `closeAll()` drops `cur`, so reading
   `cur.ch` after it would be reading a player that no longer exists. */
$('plk').onclick=()=>{if(!cur||!cur.ch)return;const ch=cur.ch;closeAll();openChannel(ch)};
$('psave').onclick=()=>{if(!cur)return;const on2=toggle(S.later,cur.id);toast(on2?'Saved to Watch later':'Removed from Watch later')};

$('pclose').onclick=closeAll;

/* loop, driven by the player's own message channel (no playlist param). Named
   rather than anonymous because it is registered and removed with the player
   (item 4.3): while no video is open there is no bridge and no frame that could
   post to it. */
function onYtMsg(e){
  const o=String(e.origin||'');
  if(!YT_ORIGIN_RE.test(o))return;
  let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return}}
  if(!d||d.event!=='onStateChange')return;
  if(+d.info===0&&S.opt.loop&&cur)mount(cur.id,cur.t);
}

/* ---------- sheets ---------- */
/* Every write of a sheet takes a generation, so a surface that is gone cannot be
   written into by an answer that is still on the wire. `sheet()` is the one place
   a sheet's content is replaced, and `closeAll()` is the one place it is taken
   away, so both raise `shGen`; the channel loader (the only sheet content that
   arrives asynchronously) reads it once and drops its writes if it moved. Without
   that, opening a channel and then closing it — or tapping Settings — inside the
   request window let the channel's answer paint itself into whatever sheet was on
   screen by then (item 4.3: the page's teardown reaches its in-flight work too). */
let shGen=0;
function sheet(t,h,inp){
  shGen++;
  $('sht').textContent=t;$('shb').innerHTML=h;$('shi').classList.toggle('on',!!inp);
  $('sheet').classList.add('on');$('scrim').classList.add('on');slideHint();
}
/* The overlays are the largest surfaces that animate: the player and the sheet
   are full-width blurred panels that slide .9 s, the search panel .85 s, and the
   scrim fades .35 s. `slideHint` covers the longest of those and takes the hint
   off again, so an overlay that is sitting open costs nothing.
   Every place that flips `.on` on one of them calls it; `closeAll` is the one
   path all the closes go through. */
const SLIDE_IDS=['search','pl','sheet','scrim'],SLIDE_HINT_MS=1000;
let slideT=0;
function slideHint(){
  const els=SLIDE_IDS.map($);
  for(let i=0;i<els.length;i++)els[i].classList.add('slide');
  clearTimeout(slideT);slideT=setTimeout(()=>{for(let i=0;i<els.length;i++)els[i].classList.remove('slide')},SLIDE_HINT_MS);
}
/* Closing takes the frame down through `dropFrame()` (so the media pipeline is
   released, not just detached) and drops `cur` with it: the Like, Save, Channel
   and Comments buttons all guard on `cur`, so a closed player can no longer be
   acted on, and nothing in the app still holds the video it was showing. */
function closeAll(){ltOff('pl');shGen++;['sheet','pl'].forEach(i=>$(i).classList.remove('on'));$('scrim').classList.remove('on');dropFrame();cur=null;slideHint()}
$('scrim').onclick=closeAll;
$('shb').addEventListener('click',e=>{
  const s=e.target.closest('[data-chsub]');
  if(s){const on2=toggle(S.subs,s.dataset.chsub);s.textContent=on2?'Subscribed':'Subscribe';toast(on2?'Subscribed':'Unsubscribed');return}
  const l=e.target.closest('[data-lib]');
  if(l){
    const k=l.dataset.lib;
    if(k==='clear'){S.hist=[];save();toast('History cleared');closeAll();return}
    if(k==='settings'){sheet('Settings',settingsHTML(),0);return}
    const ids=k==='hist'?S.hist:k==='liked'?S.liked:S.later;
    sheet(k==='hist'?'History':k==='liked'?'Liked videos':'Watch later',
      ids.length?ids.map(id=>V[id]?cardOf(V[id]):'').join(''):'<div class="empty">Nothing saved yet.</div>',0);
  }
  const o=e.target.closest('[data-opt]');
  if(o){const k=o.dataset.opt;S.opt[k]=S.opt[k]?0:1;save();if(k==='depth')applyDepth();
    if(k==='parallax')applyParallax();
    o.textContent=({cc:'Captions',loop:'Loop',cmt:'Comments',depth:'3D depth',parallax:'Parallax'})[k]+': '+(S.opt[k]?'on':'off')}
});
$('shpost').onclick=()=>toast('Comments open on YouTube');

/* ---------- search ---------- */
const qi=$('q');
/* The panel slides for .85 s, so the caret is placed after it has arrived — but
   that timer belongs to the panel and used to outlive it: cancel the search
   inside those 250 ms and the caret was still put into a field that was no
   longer on screen, raising the keyboard over the feed. One handle, and every
   close clears it (item 4.1). */
let focusT=0;
function openS(){
  $('search').classList.add('on');slideHint();
  if(focusT)clearTimeout(focusT);
  focusT=setTimeout(()=>{focusT=0;if($('search').classList.contains('on'))qi.focus()},250);
}
$('sopen').onclick=openS;

$('cancel').onclick=closeS;
$('sug').innerHTML=['lofi','AI music','calm piano','telugu songs','apple event'].map(s=>'<button class="glass">'+s+'</button>').join('');
$('sug').onclick=e=>{const b=e.target.closest('button');if(b){qi.value=b.textContent;find()}};
let seq=0;
async function find(){
  const t=qi.value.trim();
  $('sug').style.display=t?'none':'flex';
  if(!t){$('results').innerHTML='';return}
  const id=++seq;
  $('results').innerHTML=LDR+'<div class="skl"></div><div class="skl"></div>';
  try{
    const j=await yt('search',{part:'snippet',type:'video',maxResults:20,q:t});
    if(id!==seq)return;
    let list=(j.items||[]).filter(it=>it.id&&it.id.videoId).map(it=>vObj(it.id.videoId,
      {t:dec(it.snippet.title),c:dec(it.snippet.channelTitle),ch:it.snippet.channelId,pub:it.snippet.publishedAt,cat:'Result'}));
    list=await dropShorts(list);
    await loadChannels(list.map(v=>v.ch));
    if(id!==seq)return;
    $('results').innerHTML=list.length?list.map(cardOf).join(''):'<div class="empty">No videos match that.</div>';
  }catch(e){
    asSafe('search.find',e);                 /* the panel answers for itself below */
    const q=ekKind(e)==='quota';             /* the failure's class, not its wording (item 5.2) */
    rtySet('find',find);                     /* the same query, asked again */
    $('results').innerHTML='<div class="empty">'+(q?"YouTube's daily search limit is used up.":'Search failed. '+esc(ekText(e)))+rtyBtn('find',e)+'</div>';   /* our sentence, not the API's (item 5.3) */
  }
}
qi.oninput=find;

/* ---------- boot ---------- */
Object.values(S.vd||{}).forEach(o=>{if(o&&o.id)vObj(o.id,o)});
/* ---------- startup timeline ----------
   Milestones in the order they happen, ms from navigation start:
   lt:shell → lt:cache → lt:reveal → lt:paint (skeleton frame) → lt:req (first API
   call leaving) → lt:data → lt:feed → lt:feedpaint → lt:input.
   Each mark is two numbers in a fixed-size array — no DOM, no request, no storage
   while booting — and the whole run is written out once, as a single line, when
   the boot has settled. That line carries every milestone and the previous boot's
   total, so a regression is a bigger number in the log rather than something felt
   later. It stays on window.__ltTimeline for tools/startup-bench.js, and the
   WebView forwards only `lt-` lines to logcat (see MainActivity). */
const TL_CAP=16,TL=[];                      /* hard bound: marks past this are dropped */
let tlDone=false,tlTimer=0;
const mark=n=>{
  if(TL.length<TL_CAP)TL.push([n,Math.round(performance.now())]);
  try{performance.mark('lt:'+n)}catch(e){}
  tlSettle();
};
/* The timeline is written as soon as the feed has painted — that is the end of
   the boot — so the line never waits on anything. The deferred-listener mark is
   included when it landed before that (it usually does: it is attached in an idle
   slot after the skeleton frame, well before the feed comes back); when it has
   not, it is simply absent from the line. A boot that never reaches feedpaint is
   written out by the deadline below, with whatever it managed to reach. */
function tlSettle(){
  if(tlDone)return;
  for(let i=0;i<TL.length;i++)if(TL[i][0]==='feedpaint')return tlFlush();
}
const TL_KEY='lt_boot';
function tlFlush(partial){
  if(tlDone)return;tlDone=true;clearTimeout(tlTimer);
  try{
    const ms={};TL.forEach(m=>{ms[m[0]]=m[1]});
    let total=0;for(const k in ms)if(ms[k]>total)total=ms[k];   /* when the boot finished */
    let prev=0;
    try{const p=JSON.parse(localStorage.getItem(TL_KEY)||'0');prev=(p&&p.v===1&&+p.t)||0}catch(e){}
    let line='lt-startup';
    ['shell','cache','reveal','paint','req','data','feed','feedpaint','input'].forEach(n=>{
      if(n in ms)line+=' '+n+'='+ms[n];
    });
    /* warm = this boot painted the cached feed ('cache' is only marked on that
       path), err = the feed came back as an error; both are what the numbers
       above have to be read against. */
    line+=' total='+total+' prev='+prev+(prev?' vs_prev='+(total-prev>0?'+':'')+(total-prev):'')
      +' warm='+('cache' in ms?1:0)+' err='+(FEED.error?1:0)+(partial?' partial=1':'');
    window.__ltTimeline=line;
    try{localStorage.setItem(TL_KEY,JSON.stringify({v:1,t:total,at:Date.now()}))}catch(e){}
    try{console.info(line)}catch(e){}
  }catch(e){}
  try{if(DBG)scSoon()}catch(e){}       /* debug mode only: the boot has settled, the check runs */
}
tlTimer=setTimeout(()=>tlFlush(1),12000);   /* last resort: never leave a boot unlogged */

/* ---------- boot self-check, debug mode only (item 5.10) ----------
   Every item above this one left an invariant behind: a bound that must hold, a
   codec that must round-trip, a registry that must be complete, a net that must
   be installed. Until now the only thing asserting them was a script in tools/,
   on a desktop, and the shipped app could drift from the code those scripts
   measure with nothing on the device to say so. This runs the same assertions on
   the app as it actually shipped, once per boot, and only in debug mode.

   Debug mode is an opt-in and costs one string scan when it is off. It reads
   nothing else: no storage key, no request, no DOM write, no timer. It is on
   when the page was loaded with `?ltdebug=1` (also `#ltdebug`, or a bare
   `?debug`), or when `window.__LT_DEBUG===true` was set before this script ran
   — which is how `adb shell am start -n com.liquidtube.app/.MainActivity --ez
   ltdebug true` turns it on for one launch; MainActivity appends the parameter,
   so the on-device switch is an extra, not a build.

   Each probe returns true, reads only state the app already holds, touches no
   DOM and is caught on its own: one broken invariant is one `fail=` name in the
   line, never a thrown boot. The run happens in an idle slot after the shell has
   painted, so the boot's own timings are untouched, and the whole result is one
   `lt-` line — the only console prefix the WebView forwards — so
   `adb logcat -s LiquidTube` shows it beside the startup timeline.
   window.__ltSelfCheck() is the census: nothing on screen reads it, no pixel
   changes, and with debug mode off none of this ever runs. */
const DBG=(()=>{
  try{
    if(window.__LT_DEBUG===true)return 1;
    const q=' '+String(location.search||'')+' '+String(location.hash||'')+' ';
    return /[?&#](lt)?debug(=1)?[&#\s]/.test(q)?1:0;
  }catch(e){return 0}
})();
const SC_MAXL=8,SC_SEL_MAX=8;                 /* names in the line, and the misses that are still fine */
const SC_ST={runs:0,ok:0,fail:0,ms:0,fails:[],last:'',at:0};
const SC=[
  /* the shell the boot paints into: every stage-1 node, by id, still present */
  ['shell',()=>['app','feed','ex','subfeed','chips','splash'].every(id=>!!$(id))],
  /* the timeline is bounded and holds [name, ms] pairs, nothing else */
  ['timeline',()=>Array.isArray(TL)&&TL_CAP===16&&TL.length<=TL_CAP],
  ['marks',()=>TL.every(m=>!!m&&typeof m[0]==='string'&&isFinite(m[1]))],
  /* the persisted state still survives a write/read cycle through the codec */
  ['codec',()=>{const r=storeJSON({a:[1,2,3],b:'x'});const o=loadJSON(r,null);return r.indexOf(Z_PREFIX)===0&&!!o&&o.b==='x'&&o.a.length===3}],
  /* every cache and map that was given a ceiling is still under it */
  ['reqcache',()=>RQ_MAX>0&&RQ.size<=RQ_MAX&&RQI.size<=RQ_MAX*2],
  ['vmap',()=>VQ.size<=V_HI&&Object.keys(V).length<=V_HI],
  ['chmap',()=>CHQ.size<=CH_HI&&Object.keys(CH).length<=CH_HI],
  ['avatars',()=>CAVQ.size<=CAV_MAX&&Object.keys(CAV).length<=CAV_MAX],
  ['library',()=>S.hist.length<=HIST_MAX&&S.liked.length<=LIKED_MAX&&S.later.length<=LATER_MAX],
  /* the error map has a sentence for every class, and no sentence is empty */
  ['errors',()=>Object.keys(EK_TEXT).length>=10&&Object.keys(EK_TEXT).every(k=>typeof EK_TEXT[k]==='string'&&EK_TEXT[k].length>8)],
  /* a retry button can only point at a key that has something to run */
  ['retry',()=>Object.keys(RTY).length<=RTY_MAX&&Object.keys(RTY).every(k=>typeof RTY[k]==='function')],
  /* every endpoint that is validated has a validator */
  ['shape',()=>Object.keys(SH_SPEC).length>=5&&Object.keys(SH_SPEC).every(k=>typeof SH_SPEC[k]==='function')],
  ['async',()=>typeof asGuard==='function'&&typeof asSafe==='function'&&typeof asWatch==='function'&&AS_MAXW>0],
  /* the global net is installed and can still take the splash down */
  ['global',()=>typeof glHandle==='function'&&typeof glRescue==='function'&&GL_ST.n>=0],
  /* the meter is inside its own limit and knows which day it is on */
  ['quota',()=>Q.units>=0&&Q.units<=Q_LIMIT&&typeof Q.day==='string'&&Q.day.length===10],
  /* listeners are registered through the census, so teardown can find them */
  /* no owner holds more listeners than the census ever registered: the player is
     the only surface that uses it, and it is not open on a boot */
  ['surfaces',()=>typeof ltOn==='function'&&typeof ltOff==='function'&&LT_ST.on>=LT_ST.off&&LT_OWN.size<=LT_ST.on-LT_ST.off],
  ['selectors',()=>SEL_MISS.size<=SC_SEL_MAX],
  /* the text helpers that every card goes through */
  ['escape',()=>esc('<b>&"')==='&lt;b&gt;&amp;&quot;'&&dec('a&amp;b')==='a&b'],
  ['numbers',()=>num(1500)==='1.5K'&&num(2e6)==='2M'&&num(0)===''],
  /* thumbnails are armed, not asked for (6.1): a card is born with no `src` and
     no native lazy, and still ships the fallback hooks the image items read;
     and it asks for its decode off the main thread (6.2) */
  ['thumbs',()=>{const t=thumbImg('abc');return t.indexOf('data-q="0"')>0&&t.indexOf('data-l="0"')>0&&t.indexOf('decoding="async"')>0&&t.indexOf('onerror=')>0&&t.indexOf('data-id="abc"')>0&&t.indexOf('src=')<0&&t.indexOf('loading=')<0}],
  /* a card asks for the smallest size that covers its box (6.3): the ladder rounds
     up, never down, and a box that cannot be measured keeps the old request */
  ['thumbsize',()=>thumbPick(0)==='maxresdefault'&&thumbPick(1)==='mqdefault'&&thumbPick(320)==='mqdefault'&&thumbPick(321)==='hqdefault'&&thumbPick(480)==='hqdefault'&&thumbPick(481)==='sddefault'&&thumbPick(640)==='sddefault'&&thumbPick(641)==='maxresdefault'&&thumbPick(4000)==='maxresdefault'&&THUMB_LADDER.length===4],
  /* a resolved thumbnail URL is remembered per video (6.4): the second ask for
     the same id is the same string out of the map, a different id is its own
     string, and the map cannot outgrow its ceiling. Two throwaway elements, never
     inserted, so the probe costs the document nothing it can see. */
  ['thumburls',()=>{const a=document.createElement('img'),b=document.createElement('img');
    a.dataset.id='__sc_a';b.dataset.id='__sc_b';
    const u1=thumbURL(a),u2=thumbURL(a),v1=thumbURL(b);
    return u1===u2&&u1!==v1&&u1.indexOf('__sc_a')>0&&/maxresdefault\.jpg$/.test(u1)&&
      THUMB_RES.size<=THUMB_MAX&&THUMB_MAX>0&&THUMB_ST.hit>0}],
  /* the two origins the first screen needs are still warmed before it paints */
  ['preconnect',()=>qsa('link[rel="preconnect"]').length>=2],
  ['doc',()=>document.documentElement.lang==='en'&&!!qs('meta[name="viewport"]')],
  /* the settings object a render reads is shaped as every render assumes */
  ['state',()=>S_OBJ(S)&&S_OBJ(S.opt)&&typeof S.opt.depth==='number'&&typeof S.opt.pdepth==='number'],
  /* the splash left on its own: a boot that reached neither is a boot in trouble */
  ['booted',()=>revealed===true||tlDone===true]
];
/* One pass. Every probe is caught separately, so a probe that throws is a
   failure with its own name rather than the end of the run. */
function scRun(){
  const t0=rqNow();
  let ok=0,fail=0;const bad=[];
  for(let i=0;i<SC.length;i++){
    let good=0;
    try{good=SC[i][1]()?1:0}catch(e){good=0}
    if(good)ok++;else{fail++;if(bad.length<SC_MAXL)bad.push(SC[i][0])}
  }
  SC_ST.runs++;SC_ST.ok=ok;SC_ST.fail=fail;SC_ST.fails=bad;
  SC_ST.ms=Math.round(rqNow()-t0);SC_ST.at=Math.round(performance.now());
  SC_ST.last='lt-selfcheck on='+DBG+' ok='+ok+' fail='+fail+' n='+SC.length+' ms='+SC_ST.ms
    +(bad.length?' fails='+bad.join(','):'');
  try{console.info(SC_ST.last)}catch(e){}
  return SC_ST;
}
/* Idle, and after the shell has painted: the check never sits between the first
   frame and the user, and its own cost lands in a slot the boot is not using. */
function scSoon(){
  const go=()=>{try{scRun()}catch(e){}};
  try{
    if(typeof requestIdleCallback==='function')requestIdleCallback(go,{timeout:3000});
    else setTimeout(go,600);
  }catch(e){setTimeout(go,600)}
}
window.__ltSelfCheck=()=>({on:DBG,n:SC.length,ok:SC_ST.ok,fail:SC_ST.fail,ms:SC_ST.ms,
  fails:SC_ST.fails.slice(),runs:SC_ST.runs,at:SC_ST.at,last:SC_ST.last,names:SC.map(c=>c[0])});
window.__ltSelfCheckRun=()=>{try{return scRun()}catch(e){return SC_ST}};   /* tools/ re-runs it after breaking one */
let revealed=false,revealT=0;
const reveal=()=>{
  if(revealed)return;revealed=true;
  if(revealT){clearTimeout(revealT);revealT=0}   /* the hard stop is no longer owed */
  if(window.__ltRestNow)window.__ltRestNow();
  const sp=$('splash');
  if(sp&&!sp.classList.contains('out')){sp.classList.add('out');$('app').classList.add('ready')}
  mark('reveal');
};
/* Hard stop: nothing below may hold the splash up for more than 7 s. `reveal`
   clears it, so a boot that revealed in 300 ms is not left holding the closure
   (item 4.1). */
revealT=setTimeout(reveal,7000);
/* From here on the global net (item 5.4) can take the splash down the ordinary
   way, hard stop included; before this line there was nothing to call. */
glRescue=reveal;

/* First-frame-ready signal: resolves once the frame that carries the shell has
   actually been painted. Two rAFs land us after that frame; the timer and the
   visibility check cover a WebView that is not rendering at all (started in the
   background, or one that never fires rAF). Cached, so anything that needs the
   signal later gets the same promise. */
let frameReady=null;
function firstFrame(){
  if(frameReady)return frameReady;
  return frameReady=new Promise(res=>{
    let done=false,ft=0;
    const fin=()=>{if(done)return;done=true;if(ft){clearTimeout(ft);ft=0}mark('paint');res()};
    if(document.visibilityState==='hidden')return fin();
    requestAnimationFrame(()=>requestAnimationFrame(fin));
    ft=setTimeout(fin,400);                 /* the rAF path clears it when it wins */
  });
}
window.__ltFirstFrame=firstFrame;
/* Skeleton shell: the loading state the app already ships — the static #feed
   skeletons, the chip row, the carousel placeholders — painted before the feed
   request comes back, so the first frame is the shell and the splash never sits
   on the network. It starts no request of its own. */
const SK3='<div class="skl"></div><div class="skl"></div><div class="skl"></div>';
function paintSkeleton(){
  if(feed().length){                           /* last feed known: real cards, no request */
    renderChips();
    list(feed(),$('feed'));
    mark('cache');
  }else{
    $('chips').innerHTML=CHIPS_BASE.map(c=>'<button class="chip glass'+(c===cat?' on':'')+'">'+c+'</button>').join('');
    $('feed').innerHTML=LDR+SK3;
  }
  $('ex').innerHTML=shelfSkeleton();
  $('subfeed').innerHTML=SK3;
}
function paintShell(){

.thumb{aspect-ratio:16/9;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 12px 30px var(--shade)}
.thumb u{position:absolute;right:10px;bottom:10px;padding:2px 7px;border-radius:7px;background:#000a;color:#fff;font-size:11px;text-decoration:none}
.meta{display:flex;gap:10px;padding:10px 4px}
.av{flex:none;width:36px;height:36px;border-radius:50%}
.meta b{font-size:15px;line-height:1.25;display:block}.meta span{font-size:12.5px;color:var(--mute)}
.vh{display:flex;justify-content:space-between;align-items:center;padding:16px 14px 8px}.vh h2{padding:0}
.va{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:700}
.car{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.big{flex:none;width:86%;aspect-ratio:4/4.3;border-radius:30px;scroll-snap-align:center;position:relative;overflow:hidden;color:#fff;text-align:left;box-shadow:0 14px 34px var(--shade)}
.big:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000d)}
.big div{position:absolute;left:16px;right:96px;bottom:16px;z-index:2}
.big b{font-size:17px;line-height:1.25;display:block}.big small{font-size:12px;opacity:.75}
.big .play{position:absolute;right:14px;bottom:14px;z-index:3;padding:8px 15px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;display:flex;gap:5px;align-items:center}
.big .play svg{width:13px;height:13px;fill:#fff}
.dots{display:flex;gap:6px;justify-content:center;padding:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute);opacity:.4;transition:.25s}.dots i.on{opacity:1;background:var(--ink);transform:scale(1.25)}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--ink) var(--p,0%),rgba(128,128,140,.35) var(--p,0%));outline:0;position:relative;z-index:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0006,inset 0 -2px 3px #0002}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:6px 14px 10px}
.sg button{text-align:center;font-size:11.5px;font-weight:600}.sg i{display:block;width:100%;aspect-ratio:1;border-radius:50%;margin-bottom:6px;box-shadow:0 6px 16px var(--shade);transition:transform .3s,outline-color .3s;outline:3px solid transparent;outline-offset:2px}.sg .on i{outline-color:var(--red);transform:scale(.92)}
/* ===== overlays ===== */
#search{position:absolute;inset:0;z-index:30;background:var(--bg);opacity:0;pointer-events:none;transform:translateY(80px) scale(.94);transition:transform .85s var(--bounce),opacity .3s ease;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px;overflow:auto}
#search.on{opacity:1;pointer-events:auto;transform:none}
.sbar{display:flex;gap:10px;align-items:center}.sbar label{flex:1;display:flex;gap:8px;align-items:center;height:46px;border-radius:99px;padding:0 14px}
.sbar input{flex:1;background:none;border:0;outline:0;font:inherit;color:inherit;font-size:16px;min-width:0}
.sbar>button{font-weight:600;color:var(--red)}
.sug{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0}.sug button{padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600}
.res{display:flex;gap:12px;padding:10px 0;text-align:left;width:100%}.res .thumb{width:44%;flex:none;border-radius:16px}.res b{font-size:14px;line-height:1.3}
.empty{padding:40px 10px;text-align:center;color:var(--mute);font-size:14px}
.empty .rty{display:block;margin:16px auto 0;padding:0 26px;min-width:148px;font-size:14px;color:var(--ink)}
#scrim{position:absolute;inset:0;z-index:38;background:#0006;opacity:0;pointer-events:none;transition:opacity .35s}#scrim.on{opacity:1;pointer-events:auto}
#pl,#sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:40;padding:16px;border-radius:34px;display:flex;flex-direction:column;gap:8px;text-align:left;transform:translateY(125%);transition:transform .9s var(--bounce)}
/* The overlays slide for .85-.9 s when their `.on` class changes, and at no other
   time; `slideHint` adds `.slide` for the length of that slide and takes it off
   after it. `will-change:transform` here cannot change what is drawn: while the
   transition runs these surfaces carry a transform anyway (the same containing
   block and stacking context), and the hint is gone once the slide has landed. */
#search.slide,#pl.slide,#sheet.slide{will-change:transform}
#scrim.slide{will-change:opacity}
#pl.on,#sheet.on{transform:none}
#pl b{font-size:16px;line-height:1.3}#pl>span,.tm{font-size:12.5px;color:var(--mute)}.tm{display:flex;justify-content:space-between}
.prow{display:flex;gap:10px;margin-top:4px}.prow button{flex:1;height:46px;border-radius:99px;font-weight:700}
nav.dock{transition:transform .5s var(--bounce),box-shadow .4s ease}
nav.dock:active{transform:scale(.985)}
#sheet{transform-origin:50% 100%;transform:translateY(14px) rotateX(9deg) scale(.97);opacity:0;transition:transform .6s var(--bounce),opacity .35s ease}
#sheet.on{transform:none;opacity:1}
html[data-depth=off] nav.dock,html[data-depth=off] #sheet{transform:none!important}
#sheet{max-height:84%;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}#sheet h3{font-size:17px;text-align:center;padding-bottom:4px}
#shb{overflow:auto;display:flex;flex-direction:column;gap:12px;max-height:56vh;padding-bottom:6px}
.cm{display:flex;gap:10px;font-size:13.5px;line-height:1.35}.cm .av{width:30px;height:30px}.cm small{color:var(--mute);display:block;font-size:11.5px}
.nt{display:flex;gap:10px;align-items:center;font-size:13.5px}.nt .av{width:40px;height:40px}
.opt{height:48px;border-radius:99px;font-weight:700}
#shi{display:none;gap:8px}#shi.on{display:flex}#shi input{flex:1;height:44px;border-radius:99px;padding:0 16px;border:0;outline:0;font:inherit;font-size:15px;color:inherit}
#shi button{padding:0 18px;border-radius:99px;font-weight:700;color:var(--red)}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-90px);z-index:60;padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;transition:transform .85s var(--bounce);white-space:nowrap;max-width:90%}
#toast.on{transform:translate(-50%,0)}
/* ---- settings rows ---- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(120,120,140,.10);margin-bottom:10px;font-size:14px}
.setrow input[type=range]{-webkit-appearance:none;appearance:none;width:58%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--red) var(--p,45%),rgba(120,120,140,.25) var(--p,45%));outline:none}
.setrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);border:0}
.laychips{display:flex;gap:8px;margin:2px 0 14px}
.laychips button{flex:1;padding:11px 8px;border-radius:14px;background:rgba(120,120,140,.12);font-size:13px;font-weight:700;color:var(--ink);transition:background .3s,color .3s,scale .55s var(--bounce)}
.laychips button.on{background:#111;color:#fff}
/* ---- LiquidTube additions (same language as the shell) ---- */
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb u{position:absolute;right:8px;bottom:8px;z-index:2}
.big{position:relative;display:block;overflow:hidden}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.big>div{position:absolute;left:14px;right:110px;bottom:14px;z-index:2;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.big>div b{display:block;font-size:15px;line-height:1.25;max-height:2.6em;overflow:hidden}
.big>div small{display:block;font-size:12px;opacity:.85;margin-top:3px}
.big:before{content:"";position:absolute;inset:auto 0 0;height:55%;z-index:1;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.big .play{position:absolute;right:12px;bottom:12px;z-index:3}
.chh{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.chh img,.chh .av{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none}
.chh b{font-size:17px}
.mt2{font-size:12.5px;color:var(--mute);margin-top:3px}
.about{margin:10px 0;border-radius:18px;padding:10px 14px;background:rgba(120,120,140,.10)}
.about div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;color:var(--mute)}
.about b{color:var(--ink);font-weight:700}
.desc{font-size:13.5px;line-height:1.5;color:var(--ink);opacity:.86;max-height:132px;overflow:hidden;position:relative;margin-bottom:10px}
.desc:after{content:"";position:absolute;inset:auto 0 0;height:42px;background:linear-gradient(transparent,var(--bg))}
#chlist .card,#shb .card{margin-bottom:12px}
#sg button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute);width:74px;flex:none}
#sg button img,#sg button i{width:58px;height:58px;border-radius:50%;object-fit:cover;display:block;border:2px solid transparent}
#sg button.on img,#sg button.on i{border-color:var(--red)}
#sg button.on{color:var(--ink);font-weight:700}
#sg{display:flex;gap:14px;overflow-x:auto;padding:8px 14px 12px;scrollbar-width:none}
#sg::-webkit-scrollbar{display:none}
#shb{padding-bottom:10px}
.card:active{scale:.97}
.card,.big,.res,.cm,.setrow,.laychips,.opt,.about,.chh,.empty{animation:rise .85s var(--bounce) backwards}
.card{animation-delay:calc(var(--i,0)*60ms)}
.car>:nth-child(2),#shb>:nth-child(2),#results>:nth-child(2){animation-delay:.06s}
.car>:nth-child(3),#shb>:nth-child(3),#results>:nth-child(3){animation-delay:.12s}
.car>:nth-child(4),#shb>:nth-child(4),#results>:nth-child(4){animation-delay:.18s}
#shb>:nth-child(5),#results>:nth-child(5){animation-delay:.24s}
#shb>:nth-child(6),#results>:nth-child(6){animation-delay:.3s}
#shb>:nth-child(n+7),#results>:nth-child(n+7){animation-delay:.36s}
input[type=range]::-webkit-slider-thumb{transition:scale .4s var(--bounce)}
input[type=range]:active::-webkit-slider-thumb{scale:1.3}
.prow{flex-wrap:wrap}.prow button{min-width:calc(33% - 8px);font-size:13px;padding:0 6px}</script>
<script>
/* Apply the deferred sheet in the first idle slot after the splash is painted,
   and at the latest when the shell is revealed. Nothing the user can see before
   the splash leaves depends on it. */
(function(){var src=document.getElementById('lt-css-deferred');if(!src)return;var done=0;
function apply(){if(done)return;done=1;try{var s=document.createElement('style');s.id='lt-css-rest';
s.textContent=src.textContent;(document.head||document.documentElement).appendChild(s);}catch(e){}}
window.__ltRestNow=apply;
function idle(){if(window.requestIdleCallback)requestIdleCallback(apply,{timeout:800});
else setTimeout(apply,60);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',idle,{once:true});
else idle();setTimeout(apply,3000);})();
</script>
